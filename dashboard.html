.overview{display:grid;grid-template-columns:minmax(370px,1.35fr) minmax(380px,2fr);gap:14px;margin-bottom:14px}.panel{background:#fff;border:1px solid var(--line);border-radius:16px;box-shadow:0 6px 22px #17354b0b}.broadcast{padding:20px}.panel-title{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px;font-size:16px;font-weight:700}.filter-chips{display:flex;gap:5px;flex-wrap:wrap;justify-content:flex-end}.filter-chips button{border:1px solid #cfe0e5;border-radius:20px;padding:4px 11px;background:#fff;color:var(--muted);cursor:pointer;font-weight:700}.filter-chips button[data-broadcast-filter="销转中"].active{background:#fff2dc;border-color:#e8bd72;color:#995c00}.filter-chips button[data-broadcast-filter="运营中"].active{background:#e6f8f4;border-color:#9eddd2;color:#087464}.filter-chips button[data-broadcast-filter="进量中"].active{background:#e9f2fb;border-color:#a9c9e4;color:#245f8f}.broadcast-body{max-height:530px;overflow:auto;padding-right:5px}.broadcast-head{margin-bottom:12px;color:#284659;font-weight:700}.broadcast-block{padding:11px 0;border-top:1px dashed #dce7eb}.broadcast-block:first-of-type{border-top:0}.broadcast-period{margin-bottom:5px;font-weight:700;color:#173f58}.broadcast-line{display:grid;grid-template-columns:minmax(105px,1.15fr) minmax(125px,1.5fr) auto;gap:6px;padding:2px 0;color:#344d5d}.broadcast-line .variance{font-weight:700}.broadcast-empty{color:#91a0a7}.kpis{display:grid;grid-template-columns:repeat(4,1fr);align-content:start;gap:10px;padding:14px}.kpi{min-height:108px;padding:13px;border:1px solid #e1ebef;border-radius:12px;background:linear-gradient(180deg,#fff,#f8fbfc)}.kpi .label{font-size:12px;color:var(--muted)}.kpi .value{margin:5px 0 3px;font-size:24px;font-weight:750;letter-spacing:-.02em}.kpi .sub{font-size:12px;color:var(--muted)}.delta.good{color:var(--green)}.delta.bad{color:var(--red)}
.section{margin:18px 0;scroll-margin-top:78px}.section-head{justify-content:space-between;gap:12px;margin-bottom:10px;padding:14px 18px;border:1px solid var(--line);border-left:5px solid var(--navy2);border-radius:14px;background:linear-gradient(90deg,#eef5f9,#fff)}.section-title{font-size:19px;font-weight:800;color:#255f86}.section-note{color:var(--muted);font-size:12px}#personal .section-head{border-left-color:var(--teal);background:linear-gradient(90deg,#eaf9f7,#fff)}#personal .section-title{color:#087b73}#dimension .section-head{border-left-color:#8067c6;background:linear-gradient(90deg,#f3f0fb,#fff)}#dimension .section-title{color:#624aa3}.data-card{margin-bottom:12px;overflow:hidden;border-top:3px solid #b8cfdb}.card-head{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:13px 16px;border-bottom:1px solid var(--line)}.card-head strong{font-size:15px}.period-tag{gap:7px;color:var(--muted);font-size:12px}.period-tag i{width:7px;height:7px;border-radius:50%;background:var(--teal)}.scroll-hint{padding:6px 16px;background:#f7fafb;color:#82919a;font-size:11px;text-align:right}.table-scroll{position:relative;overflow:auto;max-height:520px}table{width:100%;border-collapse:separate;border-spacing:0;font-size:13px}th,td{padding:10px 12px;border-right:1px solid #e6eef1;border-bottom:1px solid #e6eef1;text-align:right;white-space:nowrap}th{position:sticky;top:0;z-index:3;background:#e8f1f6;color:#29485c;font-size:12px;text-align:right}th:first-child,td:first-child{position:sticky;left:0;z-index:2;text-align:left;background:inherit}th:first-child{z-index:4;background:#e8f1f6}tbody tr{background:#fff}tbody tr:nth-child(even){background:#f9fcfd}tbody tr:hover{background:#eef8fa}tbody tr.summary-ai{background:#e9f3fb;font-weight:800}tbody tr.summary-market{background:#f0f3f6;font-weight:800}tbody tr.compare{background:#fff2d8;font-weight:800;border-top:1px solid #e7c57e}td.name{font-weight:700;color:#23485e}td[rowspan]{vertical-align:middle;background:#f2f7fa!important;border-right-color:#d2e1e8;font-weight:800}.metric-up{background:#dff3e6!important;color:#0b7049;font-weight:800}.metric-down{background:#fbe3e7!important;color:#b43848;font-weight:800}.metric-same{background:#f2f4f5!important;color:#657781}.good{color:var(--green)}.bad{color:var(--red)}.empty{color:#9aa8ae}.tabs{display:flex;gap:7px;flex-wrap:wrap;padding:0 16px 13px}.tabs button{padding:6px 12px}.dimension-period-control{display:flex;align-items:center;gap:9px;padding:8px 10px;border:1px solid #b7a8df;border-radius:12px;background:#fff;box-shadow:0 5px 16px #65509b16;color:#564582;font-weight:800}.dimension-period-control:before{content:"筛选";padding:3px 7px;border-radius:12px;background:#8067c6;color:#fff;font-size:10px;letter-spacing:.08em}.dimension-period-control select{min-width:170px!important;margin-left:0!important;border-color:#9d8bd0!important;background:#faf8ff!important;font-weight:700}.panel-title>span:first-child{display:flex;align-items:center;gap:8px}.panel-title>span:first-child:before{content:"";width:9px;height:9px;border-radius:3px;background:var(--teal);box-shadow:0 0 0 4px #14a3a018}.personal-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.personal-grid .data-card{margin:0}.metric-row{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:0 16px 14px}.mini{padding:10px;border-radius:10px;background:#f4f9fb}.mini b{display:block;font-size:17px}.mini span{font-size:11px;color:var(--muted)}.loading,.error{padding:70px;text-align:center}.error{color:var(--red)}.footer{padding:18px;text-align:center;color:#81909a;font-size:12px}
@media(max-width:1050px){.overview{grid-template-columns:1fr}.personal-grid{grid-template-columns:1fr}.kpis{grid-template-columns:repeat(2,1fr)}}@media(max-width:640px){.shell{padding:10px}.hero{padding:20px}.hero-row{align-items:flex-start;flex-direction:column}.hero h1{font-size:23px}.kpis{grid-template-columns:1fr 1fr}.toolbar .refresh-control{margin-left:0}.overview{grid-template-columns:1fr}.section-head{align-items:flex-start;flex-direction:column}}@media print{body{background:#fff}.shell{max-width:none;padding:0}.hero,.toolbar,.panel,.data-card{box-shadow:none}.toolbar{position:static}.toolbar a,.toolbar button{display:none}.table-scroll{max-height:none;overflow:visible}th{position:static}th:first-child,td:first-child{position:static}.personal-grid{grid-template-columns:1fr}}
</style></head><body><main class="shell">
<header class="hero"><div class="hero-row"><div><div class="eyebrow">NUTRITION AI · DAILY REPORT</div><h1>营养AI组日报在线表格</h1><p>运营行课、销转结果、销售个人与细分维度的一体化日报</p></div><div class="status"><span class="dot"></span><span id="heroStatus">正在读取最新数据</span></div></div></header>
<nav class="toolbar"><a href="#overview">今日概览</a><a href="#team">团队整体</a><a href="#personal">销售个人</a><a href="#dimension">细分维度</a><label>指标期数 <select id="period"></select></label><a class="refresh-control" href="http://127.0.0.1:18765/" target="_blank" rel="noopener" title="仅管理员本机可用">刷新数据</a><button class="export" id="export">导出 Excel</button></nav>
<div id="content"><div class="loading">正在加载“查询1”聚合数据…</div></div><footer class="footer">数据源：Excel「查询1」｜每天 14:00、22:00 自动更新｜仅展示聚合指标</footer>
</main><script>
const AI='AI先锋组',MARKET='大盘组',ALL_PERIODS='__all__',broadcastStatuses=new Set(['销转中','运营中','进量中']);let dimensionPeriodName='',currentDimensionKey='age';
const E=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const F={p:v=>v==null?'—':(v*100).toFixed(1)+'%',n:(v,d=0)=>v==null?'—':Number(v).toLocaleString('zh-CN',{maximumFractionDigits:d}),m:v=>v==null?'—':'¥'+Number(v).toLocaleString('zh-CN',{maximumFractionDigits:0}),r:v=>v==null?'—':Number(v).toFixed(2)};
const d=(a,b,type='p')=>{if(a==null||b==null)return '—';const x=a-b,s=x>=0?'+':'';return type==='p'?s+(x*100).toFixed(1)+'%':type==='m'?s+F.m(x):s+F.n(x,2)};
const cls=(a,b,reverse=false)=>a==null||b==null?'':((a-b)*(reverse?-1:1)>0?'good':(a-b)*(reverse?-1:1)<0?'bad':'');
const cell=(v,c='')=>`<td class="${c}">${E(v)}</td>`;
function table(title,heads,rows,note='左右滑动查看全部指标'){return `<article class="panel data-card"><div class="card-head"><strong>${E(title)}</strong><span class="period-tag"><i></i>${E(note)}</span></div><div class="scroll-hint">← 横向滚动可查看完整列 →</div><div class="table-scroll"><table><thead><tr>${heads.map(h=>`<th>${E(h)}</th>`).join('')}</tr></thead><tbody>${rows.join('')}</tbody></table></div></article>`}
const touchHeads=['期数','时间','部门','线索数','线索占比','进群率','好友率','开口率','好友开口率','有效会话率'];
const classHeads=['期数','时间','部门','先导到课率','先导完课率',...['D1','D2','D3','D4'].flatMap(x=>[x+'到课率',x+'完课率',x+'直播完课率'])];
const courseHeads=[...touchHeads,...classHeads.slice(3)];
const convHeads=['期数','时间','部门','总转化率','直播转率','社群转率','GMV','ROI','LTV','人效','人服比','今日总转化率','今日直播转率','今日社群转率','今日ROI','单粉成本'];
function touchVals(m,share){return [F.n(m.leads),F.p(share),F.p(m.groupRate),F.p(m.friendRate),F.p(m.openRate),F.p(m.friendOpenRate),F.p(m.validConversationRate)]}
function classVals(m){const out=[];m.attendance.forEach((x,i)=>{out.push(F.p(x.attendanceRate),F.p(x.completionRate));if(i)out.push(F.p(x.liveCompletionRate))});return out}
function courseVals(m,share){return [...touchVals(m,share),...classVals(m)]}
function convVals(m){return [F.p(m.conversionRate),F.p(m.liveConversionRate),F.p(m.communityConversionRate),F.m(m.gmv),F.r(m.roi),F.m(m.ltv),F.m(m.productivity),F.n(m.serviceRatio,1),F.p(m.todayConversionRate),F.p(m.todayLiveConversionRate),F.p(m.todayCommunityConversionRate),F.r(m.todayRoi),F.m(m.singleFanCost)]}
function normalRow(p,label,m,mode,share){const vals=mode==='touch'?touchVals(m,share):mode==='class'?classVals(m):mode==='course'?courseVals(m,share):convVals(m),summary=label===AI||label==='大盘'||label.includes('汇总'),rowClass=summary?(label.includes('AI先锋')||label===AI?'summary-ai':'summary-market'):'';return `<tr class="${rowClass}">${cell(p.name,'name')}${cell(p.phase)}${cell(label,'name')}${vals.map(v=>cell(v)).join('')}</tr>`}
function compareRow(p,a,b,mode,label='AI先锋组 - 大盘'){let specs;if(mode==='touch')specs=[null,null,['groupRate','p'],['friendRate','p'],['openRate','p'],['friendOpenRate','p'],['validConversationRate','p']];else if(mode==='class'){specs=[];a.attendance.forEach((x,i)=>{specs.push([`attendance.${i}.attendanceRate`,'p'],[`attendance.${i}.completionRate`,'p']);if(i)specs.push([`attendance.${i}.liveCompletionRate`,'p'])})}else if(mode==='course'){specs=[null,null,['groupRate','p'],['friendRate','p'],['openRate','p'],['friendOpenRate','p'],['validConversationRate','p']];a.attendance.forEach((x,i)=>{specs.push([`attendance.${i}.attendanceRate`,'p'],[`attendance.${i}.completionRate`,'p']);if(i)specs.push([`attendance.${i}.liveCompletionRate`,'p'])})}else specs=[['conversionRate','p'],['liveConversionRate','p'],['communityConversionRate','p'],['gmv','m'],['roi','n'],['ltv','m'],['productivity','m'],['serviceRatio','n'],['todayConversionRate','p'],['todayLiveConversionRate','p'],['todayCommunityConversionRate','p'],['todayRoi','n'],['singleFanCost','m']];const get=(o,k)=>k?.split('.').reduce((v,x)=>v?.[x],o);const vals=specs.map(s=>{if(!s)return{v:'—',c:''};const av=get(a,s[0]),bv=get(b,s[0]);return{v:d(av,bv,s[1]),c:cls(av,bv,s[0]==='singleFanCost')}});return `<tr class="compare">${cell(p.name,'name')}${cell('对比')}${cell(label,'name')}${vals.map(x=>cell(x.v,x.c)).join('')}</tr>`}
function teamRows(periods,mode){const rows=[];for(const p of periods){const a=p.groups[AI]?.total,b=p.groups[MARKET]?.total,total=(a?.leads||0)+(b?.leads||0);if(a)rows.push(normalRow(p,AI,a,mode,a.leads/(total||1)));if(b)rows.push(normalRow(p,'大盘',b,mode,b.leads/(total||1)));if(a&&b)rows.push(compareRow(p,a,b,mode))}return rows}
function personalRows(periods,mode){const rows=[];for(const p of periods){const ai=p.groups[AI],market=p.groups[MARKET],total=(ai?.total.leads||0)+(market?.total.leads||0);if(ai){rows.push(normalRow(p,'AI先锋组汇总',ai.total,mode,ai.total.leads/(total||1)));for(const sale of ai.dimensions.sales||[])rows.push(normalRow(p,`↳ ${sale.label}`,sale,mode,sale.leads/(ai.total.leads||1)))}if(market)rows.push(normalRow(p,'大盘组汇总',market.total,mode,market.total.leads/(total||1)))}return rows}
function kpi(label,value,a,b,detail,type='p',reverse=false){const compare=a!=null&&b!=null?` <span class="delta ${cls(a,b,reverse)}">${E(d(a,b,type))}</span>`:'';return `<div class="kpi"><div class="label">${E(label)}</div><div class="value">${E(value)}</div><div class="sub">${E(detail)}${compare}</div></div>`}
const metricFormat=(v,type)=>type==='p'?F.p(v):type==='m'?F.m(v):type==='n'?F.r(v):F.n(v);
function broadcastLine(label,a,b,type='p'){return `<div class="broadcast-line"><span>【${E(label)}】</span><span>${E(metricFormat(a,type))}（大盘 ${E(metricFormat(b,type))}）</span><span class="variance ${cls(a,b)}">${E(d(a,b,type))}</span></div>`}
function broadcastBlock(p){const a=p.groups[AI]?.total,b=p.groups[MARKET]?.total,phase=String(p.phase).replace(/\s+/g,'');let html=`<div class="broadcast-block" data-broadcast-status="${E(p.status)}"><div class="broadcast-period">${E(p.name)}（${E(phase)}）-${E(p.status)}</div>`;if(!a)return html+`<div class="broadcast-empty">当前暂无 AI先锋组数据；大盘线索 ${E(F.n(b?.leads))}</div></div>`;if(p.status==='销转中')html+=broadcastLine('ROI',a.roi,b?.roi,'n')+broadcastLine('人效',a.productivity,b?.productivity,'m')+broadcastLine('LTV',a.ltv,b?.ltv,'m')+broadcastLine('转化率',a.conversionRate,b?.conversionRate)+broadcastLine('今日ROI',a.todayRoi,b?.todayRoi,'n')+broadcastLine('今日转化率',a.todayConversionRate,b?.todayConversionRate);else{if(p.status==='进量中')html+=broadcastLine('线索数',a.leads,b?.leads,'i');html+=broadcastLine('好友率',a.friendRate,b?.friendRate)+broadcastLine('进群率',a.groupRate,b?.groupRate)+broadcastLine('开口率',a.openRate,b?.openRate)+broadcastLine('好友开口率',a.friendOpenRate,b?.friendOpenRate)+broadcastLine('先导课到课率',a.attendance[0]?.attendanceRate,b?.attendance[0]?.attendanceRate)+broadcastLine('先导课完课率',a.attendance[0]?.completionRate,b?.attendance[0]?.completionRate);if(p.status==='运营中')for(let i=1;i<a.attendance.length;i++)html+=broadcastLine(`${a.attendance[i].day}到课率`,a.attendance[i].attendanceRate,b?.attendance[i]?.attendanceRate)+broadcastLine(`${a.attendance[i].day}完课率`,a.attendance[i].completionRate,b?.attendance[i]?.completionRate)}return html+'</div>'}
function broadcastHtml(data,periodName=ALL_PERIODS){const time=new Date(data.generatedAt),stamp=`${String(time.getMonth()+1).padStart(2,'0')}.${String(time.getDate()).padStart(2,'0')} ${String(time.getHours()).padStart(2,'0')}:${String(time.getMinutes()).padStart(2,'0')}`,order=['销转中','运营中','进量中'],periods=order.flatMap(s=>data.periods.filter(p=>p.status===s)).filter(p=>periodName===ALL_PERIODS||p.name===periodName);return `<div class="broadcast-head">【AI先锋组播报结果】截止${stamp}</div>${periods.filter(p=>broadcastStatuses.has(p.status)).map(broadcastBlock).join('')||'<div class="broadcast-empty">当前筛选条件暂无可播报数据</div>'}`}
function kpiHtml(p){const a=p.groups[AI]?.total,b=p.groups[MARKET]?.total;if(!a)return kpi('AI先锋组数据','—',null,null,`${p.name} 当前暂无数据`);if(['销转中','已结营'].includes(p.status))return kpi('ROI',F.r(a.roi),a.roi,b?.roi,'较大盘','n')+kpi('人效',F.m(a.productivity),a.productivity,b?.productivity,'较大盘','m')+kpi('LTV',F.m(a.ltv),a.ltv,b?.ltv,'较大盘','m')+kpi('总转化率',F.p(a.conversionRate),a.conversionRate,b?.conversionRate,'较大盘')+kpi('今日ROI',F.r(a.todayRoi),a.todayRoi,b?.todayRoi,'较大盘','n')+kpi('今日转化率',F.p(a.todayConversionRate),a.todayConversionRate,b?.todayConversionRate,'较大盘');return kpi('线索数',F.n(a.leads),null,null,`${p.name} · ${p.status}`,'i')+kpi('好友率',F.p(a.friendRate),a.friendRate,b?.friendRate,'较大盘')+kpi('进群率',F.p(a.groupRate),a.groupRate,b?.groupRate,'较大盘')+kpi('开口率',F.p(a.openRate),a.openRate,b?.openRate,'较大盘')+kpi('好友开口率',F.p(a.friendOpenRate),a.friendOpenRate,b?.friendOpenRate,'较大盘')+kpi('先导到课率',F.p(a.attendance[0]?.attendanceRate),a.attendance[0]?.attendanceRate,b?.attendance[0]?.attendanceRate,'较大盘')+kpi('先导完课率',F.p(a.attendance[0]?.completionRate),a.attendance[0]?.completionRate,b?.attendance[0]?.completionRate,'较大盘')+kpi('有效会话率',F.p(a.validConversationRate),a.validConversationRate,b?.validConversationRate,'较大盘')}
function overview(data,selected,periodName){const filterNames={'销转中':'销转','运营中':'运营','进量中':'进量'};return `<section id="overview" class="overview"><article class="panel broadcast"><div class="panel-title"><span>数据播报简报</span><span class="filter-chips">${['销转中','运营中','进量中'].map(s=>`<button data-broadcast-filter="${s}" class="${broadcastStatuses.has(s)?'active':''}">${filterNames[s]}</button>`).join('')}</span></div><div id="broadcastBody" class="broadcast-body">${broadcastHtml(data,periodName)}</div></article><article class="panel kpis" id="kpiPanel">${kpiHtml(selected)}</article></section>`}
const dimCourseHeads=['分类','范围','线索数','好友率','进群率','开口率','好友开口率','有效会话率',...classHeads.slice(3)],dimConvHeads=['分类','范围',...convHeads.slice(3)];
function dimensionRows(p,key,mode){const ai=p.groups[AI]?.dimensions[key]||[],market=p.groups[MARKET]?.dimensions[key]||[],am=new Map(ai.map(x=>[x.label,x])),bm=new Map(market.map(x=>[x.label,x])),labels=[...new Set([...am.keys(),...bm.keys()])],rows=[];const vals=m=>mode==='course'?[F.n(m.leads),F.p(m.friendRate),F.p(m.groupRate),F.p(m.openRate),F.p(m.friendOpenRate),F.p(m.validConversationRate),...classVals(m)]:convVals(m);for(const label of labels){const a=am.get(label),b=bm.get(label);if(a)rows.push(`<tr>${cell(label,'name')}${cell('先锋组','name')}${vals(a).map(v=>cell(v)).join('')}</tr>`);if(b)rows.push(`<tr>${cell(label,'name')}${cell('大盘')}${vals(b).map(v=>cell(v)).join('')}</tr>`);if(a&&b){let specs=mode==='course'?[null,['friendRate','p'],['groupRate','p'],['openRate','p'],['friendOpenRate','p'],['validConversationRate','p']]:[['conversionRate','p'],['liveConversionRate','p'],['communityConversionRate','p'],['gmv','m'],['roi','n'],['ltv','m'],['productivity','m'],['serviceRatio','n'],['todayConversionRate','p'],['todayLiveConversionRate','p'],['todayCommunityConversionRate','p'],['todayRoi','n'],['singleFanCost','m']];if(mode==='course')a.attendance.forEach((x,i)=>{specs.push([`attendance.${i}.attendanceRate`,'p'],[`attendance.${i}.completionRate`,'p']);if(i)specs.push([`attendance.${i}.liveCompletionRate`,'p'])});const get=(o,k)=>k?.split('.').reduce((v,x)=>v?.[x],o);rows.push(`<tr class="compare">${cell(label,'name')}${cell('对比大盘','name')}${specs.map(s=>s?cell(d(get(a,s[0]),get(b,s[0]),s[1]),cls(get(a,s[0]),get(b,s[0]))):cell('—')).join('')}</tr>`)}}return rows}
const metricNumber=value=>{const text=String(value??'').trim();if(!text||text==='—')return null;const n=Number(text.replace(/,/g,'').replace(/[^d.+-]/g,''));return Number.isFinite(n)?n:null};
function toneCell(cell,a,b){if(!cell||a==null||b==null)return;cell.classList.add(a>b?'metric-up':a<b?'metric-down':'metric-same')}
function toneDeltaRow(cells,start){for(let i=start;i<cells.length;i++){const n=metricNumber(cells[i].textContent);if(n==null)continue;cells[i].classList.add(n>0?'metric-up':n<0?'metric-down':'metric-same')}}
function mergeCells(matrix,columns){for(const column of columns){let anchor=null,lastKey='',span=1;for(const cells of matrix){const key=cells.slice(0,column+1).map(c=>c.textContent.trim()).join('\u0001'),current=cells[column];if(anchor&&key===lastKey){span++;anchor.rowSpan=span;current.style.display='none'}else{anchor=current;lastKey=key;span=1}}}}
function enhanceTable(table){if(table.dataset.enhanced)return;table.dataset.enhanced='true';const heads=[...table.querySelectorAll('thead th')].map(x=>x.textContent.trim()),matrix=[...table.querySelectorAll('tbody tr')].map(r=>[...r.cells]);if(!matrix.length)return;if(heads[0]==='期数'){const groups=new Map;for(const cells of matrix){const key=cells[0].textContent.trim();if(!groups.has(key))groups.set(key,[]);groups.get(key).push(cells)}for(const rows of groups.values()){const market=rows.find(c=>c[2]?.textContent.includes('大盘')&&!c[1]?.textContent.includes('对比')&&!c[2]?.textContent.includes('对比'));if(market)for(const cells of rows){const label=cells[2]?.textContent.trim()||'',isCompare=cells[1]?.textContent.includes('对比')||label.includes('对比');if(label.includes('先锋组')||label.startsWith('↳'))for(let i=3;i<cells.length;i++)toneCell(cells[i],metricNumber(cells[i].textContent),metricNumber(market[i]?.textContent));if(isCompare)toneDeltaRow(cells,3)}}mergeCells(matrix,[0,1])}else if(heads[0]==='分类'){const groups=new Map;for(const cells of matrix){const key=cells[0].textContent.trim();if(!groups.has(key))groups.set(key,[]);groups.get(key).push(cells)}for(const rows of groups.values()){const market=rows.find(c=>c[1]?.textContent.trim()==='大盘');const ai=rows.find(c=>c[1]?.textContent.trim()==='先锋组');if(ai&&market)for(let i=2;i<ai.length;i++)toneCell(ai[i],metricNumber(ai[i].textContent),metricNumber(market[i]?.textContent));const compare=rows.find(c=>c[1]?.textContent.includes('对比'));if(compare)toneDeltaRow(compare,2)}mergeCells(matrix,[0])}}
function enhanceTables(root=document){root.querySelectorAll('table').forEach(enhanceTable)}
function render(data,periodName){
  const course=data.periods.filter(p=>['进量中','运营中'].includes(p.status)),conv=data.periods.filter(p=>['销转中','已结营'].includes(p.status)),selected=data.periods.find(p=>p.name===periodName)||data.periods.find(p=>p.status==='销转中'&&p.groups[AI])||data.periods[0];
  let html=overview(data,selected,periodName);
  html+=`<section id="team" class="section"><div class="section-head"><div><div class="section-title">团队整体</div><div class="section-note">上课数据合并展示触达、互动和课程表现</div></div></div>${table('上课数据',courseHeads,teamRows(course,'course'),'状态：进量中、运营中 · 先导至D4')}${table('转化结果',convHeads,teamRows(conv,'conv'),'状态：销转中、已结营')}</section>`;
  html+=`<section id="personal" class="section"><div class="section-head"><div><div class="section-title">销售个人</div><div class="section-note">保留 AI先锋组、大盘组汇总；AI先锋组下展开销售，不展示对比行</div></div></div>${table('销售个人 · 上课数据',courseHeads,personalRows(course,'course'),'进量中、运营中')}${table('销售个人 · 转化结果',convHeads,personalRows(conv,'conv'),'销转中、已结营')}</section>`;
  const labels={age:'年龄',gender:'性别',leadLevel:'初始线索等级',intakeDay:'进量日',channel:'三级渠道'},dimOptions=data.periods.map(p=>`<option value="${E(p.name)}">${E(p.name)} · ${E(p.status)}</option>`).join('');
  if(!data.periods.some(p=>p.name===dimensionPeriodName))dimensionPeriodName=selected.name;
  html+=`<section id="dimension" class="section"><div class="section-head"><div><div class="section-title">细分维度</div><div class="section-note">补充完整上课内容，并保留转化指标</div></div><label class="dimension-period-control"><span>维度期数</span><select id="dimPeriod">${dimOptions}</select></label></div><div class="tabs">${Object.entries(labels).map(([k,v])=>`<button data-dim="${k}" class="${k===currentDimensionKey?'active':''}">${v}</button>`).join('')}</div><div id="dimTable"></div></section>`;
  const content=document.getElementById('content');content.innerHTML=html;
  const dimSelect=document.getElementById('dimPeriod');dimSelect.value=dimensionPeriodName;
  const draw=k=>{currentDimensionKey=k;const dimSelected=data.periods.find(p=>p.name===dimSelect.value)||selected,dimTable=document.getElementById('dimTable');dimTable.innerHTML=table(`${labels[k]} · 上课数据 · ${dimSelected.name}`,dimCourseHeads,dimensionRows(dimSelected,k,'course'),`${dimSelected.status} · ${dimSelected.phase}`)+table(`${labels[k]} · 转化结果 · ${dimSelected.name}`,dimConvHeads,dimensionRows(dimSelected,k,'conv'),`${dimSelected.status} · ${dimSelected.phase}`);enhanceTables(dimTable)};
  draw(currentDimensionKey);
  dimSelect.onchange=()=>{dimensionPeriodName=dimSelect.value;draw(currentDimensionKey)};
  document.querySelectorAll('[data-dim]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-dim]').forEach(x=>x.classList.remove('active'));b.classList.add('active');draw(b.dataset.dim)});
  document.querySelectorAll('[data-broadcast-filter]').forEach(b=>b.onclick=()=>{broadcastStatuses.has(b.dataset.broadcastFilter)?broadcastStatuses.delete(b.dataset.broadcastFilter):broadcastStatuses.add(b.dataset.broadcastFilter);b.classList.toggle('active');document.getElementById('broadcastBody').innerHTML=broadcastHtml(data,periodName)});
  enhanceTables(content)
}
function exportExcel(){const tables=[...document.querySelectorAll('table')];const body=tables.map((t,i)=>`<h2>${E(t.closest('.data-card')?.querySelector('strong')?.textContent||'数据表'+(i+1))}</h2>${t.outerHTML}<br>`).join('');const html=`<html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:x="urn:schemas-microsoft-com:office:excel"><head><meta charset="UTF-8"><style>table{border-collapse:collapse}th,td{border:1px solid #bbb;padding:6px}th{background:#dce6f1}</style></head><body>${body}</body></html>`;const blob=new Blob(['\ufeff',html],{type:'application/vnd.ms-excel;charset=utf-8'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`营养AI组日报_${new Date().toISOString().slice(0,10)}.xls`;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
async function start(){try{let r=await fetch('api/dashboard',{cache:'no-store'});if(!r.ok)r=await fetch('data/dashboard.json',{cache:'no-store'});if(!r.ok)r=await fetch('dashboard.json',{cache:'no-store'});const data=await r.json(),sel=document.getElementById('period');sel.innerHTML=`<option value="${ALL_PERIODS}">全部期数</option>`+data.periods.map(p=>`<option value="${E(p.name)}">${E(p.name)} · ${E(p.status)}</option>`).join('');sel.value=ALL_PERIODS;sel.onchange=()=>render(data,sel.value);document.getElementById('export').onclick=exportExcel;const time=new Date(data.generatedAt).toLocaleString('zh-CN',{hour12:false});document.getElementById('heroStatus').textContent=`已更新 ${time} · ${F.n(data.source.rowCount)} 行`;render(data,sel.value)}catch(e){document.getElementById('content').innerHTML=`<div class="error">数据加载失败：${E(e.message)}</div>`;document.getElementById('heroStatus').textContent='数据加载失败'}}start();
</script></body></html>
