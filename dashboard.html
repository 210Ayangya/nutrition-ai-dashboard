<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>营养AI组日报在线表格</title>
  <style>
    :root{
      --ink:#253247;--muted:#778398;--line:#e7ebf2;--surface:#fff;--page:#f6f8fb;
      --conversion:#7b45c6;--conversion-soft:#f7f2fd;
      --operation:#3978e8;--operation-soft:#f2f6ff;
      --volume:#2f9d63;--volume-soft:#f1faf5;
      --active:var(--conversion);--active-soft:var(--conversion-soft);
      --shadow:0 8px 26px rgba(35,49,74,.06)
    }
    *{box-sizing:border-box}
    html{scroll-behavior:smooth}
    body{margin:0;background:var(--page);color:var(--ink);font:14px/1.55 Inter,"Segoe UI","Microsoft YaHei",Arial,sans-serif}
    body[data-template="销转中"]{--active:var(--conversion);--active-soft:var(--conversion-soft)}
    body[data-template="运营中"]{--active:var(--operation);--active-soft:var(--operation-soft)}
    body[data-template="进量中"]{--active:var(--volume);--active-soft:var(--volume-soft)}
    button,select{font:inherit}
    button,a{transition:.18s ease}
    .shell{max-width:1720px;margin:auto;padding:20px}
    .hero{display:flex;align-items:center;justify-content:space-between;gap:22px;padding:24px 28px;border:1px solid var(--line);border-left:5px solid var(--active);border-radius:18px;background:#fff;box-shadow:var(--shadow)}
    .eyebrow{color:var(--active);font-size:11px;font-weight:800;letter-spacing:.16em}
    h1{margin:3px 0 3px;font-size:28px;letter-spacing:-.02em}
    .hero p{margin:0;color:var(--muted)}
    .freshness{display:flex;align-items:center;gap:8px;color:#5c697c;white-space:nowrap}
    .freshness:before{content:"";width:8px;height:8px;border-radius:50%;background:#2eb67d;box-shadow:0 0 0 5px #2eb67d18}
    .toolbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:12px 0;padding:9px 11px;border:1px solid var(--line);border-radius:14px;background:#fffffff2;box-shadow:0 6px 20px #2638540c;backdrop-filter:blur(12px)}
    .toolbar a,.toolbar button,.toolbar select{border:1px solid #dfe5ed;border-radius:9px;background:#fff;color:#536176;padding:7px 11px;text-decoration:none;cursor:pointer}
    .toolbar a:hover,.toolbar button:hover{border-color:var(--active);color:var(--active)}
    .toolbar label{display:flex;align-items:center;gap:6px;color:#738094;font-size:12px}
    .toolbar select{font-weight:700;color:#37465a}
    .toolbar .refresh-now{margin-left:auto;border-color:#eed8a8;background:#fff9eb;color:#8e6417;font-weight:800}
    .toolbar .export{border-color:#2ca69a;background:#2ca69a;color:#fff;font-weight:800}
    .last-refresh{color:#8691a0;font-size:12px}
    .template-guide{display:grid;grid-template-columns:220px repeat(3,1fr);gap:9px;align-items:stretch;margin-bottom:14px}
    .guide-label{display:flex;flex-direction:column;justify-content:center;padding:13px 16px;border:1px solid var(--line);border-radius:14px;background:#fff}
    .guide-label b{font-size:16px;color:var(--active)}
    .guide-label span{color:var(--muted);font-size:12px}
    .template-button{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 15px;border:1px solid var(--line);border-radius:14px;background:#fff;color:#526075;cursor:pointer;text-align:left}
    .template-button b{display:block;font-size:15px}
    .template-button small{color:#8c97a6}
    .template-button i{display:block;flex:0 0 10px;width:10px;height:10px;border-radius:50%}
    .template-button[data-template-button="销转中"] i{background:var(--conversion)}
    .template-button[data-template-button="运营中"] i{background:var(--operation)}
    .template-button[data-template-button="进量中"] i{background:var(--volume)}
    .template-button.active{border-color:var(--active);background:var(--active-soft);box-shadow:0 0 0 2px color-mix(in srgb,var(--active) 12%,transparent)}
    .overview{display:grid;grid-template-columns:minmax(360px,.86fr) minmax(680px,1.6fr);gap:13px;margin-bottom:18px}
    .panel,.status-card{border:1px solid var(--line);border-radius:16px;background:#fff;box-shadow:var(--shadow)}
    .broadcast{padding:18px}
    .panel-heading{display:flex;align-items:center;gap:8px;margin-bottom:12px;font-size:17px;font-weight:800}
    .panel-heading:before{content:"";width:4px;height:18px;border-radius:3px;background:var(--active)}
    .broadcast-list{max-height:475px;overflow:auto;padding-right:5px}
    .broadcast-block{padding:10px 0;border-top:1px solid #edf0f4}
    .broadcast-block:first-child{border-top:0;padding-top:0}
    .broadcast-title{margin-bottom:5px;font-weight:800}
    .broadcast-title.conversion{color:var(--conversion)}
    .broadcast-title.operation{color:var(--operation)}
    .broadcast-title.volume{color:var(--volume)}
    .broadcast-line{display:grid;grid-template-columns:112px 1fr auto;gap:6px;padding:2px 0;color:#58677a}
    .broadcast-line.today{font-weight:800;color:#c44758}
    .broadcast-line .delta{font-weight:800}
    .summary-rack{display:grid;gap:10px;padding:12px}
    .summary-card{position:relative;border:1px solid;border-radius:13px;background:#fff;overflow:hidden}
    .summary-card.conversion{border-color:#d5c3ed}
    .summary-card.operation{border-color:#bdd1f6}
    .summary-card.volume{border-color:#b8dfca}
    .summary-title{display:inline-flex;padding:7px 14px;border-radius:0 0 9px 0;color:#fff;font-size:14px;font-weight:800}
    .summary-card.conversion .summary-title{background:var(--conversion)}
    .summary-card.operation .summary-title{background:var(--operation)}
    .summary-card.volume .summary-title{background:var(--volume)}
    .summary-metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:0;padding:8px 12px 12px}
    .summary-metric{min-height:58px;padding:7px 9px;border-right:1px solid #edf0f4}
    .summary-metric:nth-child(4n){border-right:0}
    .summary-metric span{display:block;color:#7d8898;font-size:11px}
    .summary-metric b{display:block;margin-top:3px;font-size:18px;font-variant-numeric:tabular-nums}
    .summary-metric.today b{color:#d94155}
    .section{margin:18px 0;scroll-margin-top:78px}
    .section-heading{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:10px;padding:13px 16px;border:1px solid var(--line);border-left:4px solid var(--active);border-radius:13px;background:#fff}
    .section-heading h2{margin:0;font-size:19px;color:var(--active)}
    #personal .section-heading{border-left-color:#2ca69a}
    #personal .section-heading h2{color:#21887e}
    #dimension .section-heading{border-left-color:#7865bd}
    #dimension .section-heading h2{color:#6652aa}
    .status-card{margin-bottom:11px;overflow:hidden;scroll-margin-top:92px}
    .status-card.focused{box-shadow:0 0 0 2px color-mix(in srgb,var(--status-color) 25%,transparent),var(--shadow)}
    .status-card.conversion{--status-color:var(--conversion);--status-soft:var(--conversion-soft)}
    .status-card.operation{--status-color:var(--operation);--status-soft:var(--operation-soft)}
    .status-card.volume{--status-color:var(--volume);--status-soft:var(--volume-soft)}
    .status-card-head{height:38px;padding-left:12px;border-bottom:1px solid var(--line);background:#fff}
    .period-status{display:inline-flex;align-items:center;height:38px;padding:0 15px;border-radius:0 0 9px 9px;background:var(--status-color);color:#fff;font-weight:800;letter-spacing:.01em}
    .table-scroll{overflow:auto;max-height:520px}
    table{width:100%;border-collapse:separate;border-spacing:0;font-size:13px}
    th,td{height:42px;padding:8px 12px;border-right:1px solid #edf0f4;border-bottom:1px solid #edf0f4;text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
    th{position:sticky;top:0;z-index:3;background:#f3f6fa;color:#4e5d72;font-size:12px;font-weight:800}
    th:first-child,td:first-child{text-align:left}
    tbody tr:not(.compare-row):not(.summary-row):hover td:not(.metric-up):not(.metric-down):not(.metric-same){background-color:#f8fafc}
    .summary-row>td{background-color:#FFF4CC;font-weight:600}
    .compare-row>td{background-color:#EAF2FF;font-weight:600}
    td.metric-up{background-color:#E8F5E9!important;color:#243142;font-weight:600}
    td.metric-down{background-color:#FDECEC!important;color:#243142;font-weight:600}
    td.metric-same{background-color:#F2F3F5!important;color:#243142;font-weight:600}
    .today-head,.today-cell{font-weight:800!important;color:#d94155!important;background-color:#fff5f6!important}
    .compare-row .today-cell{background-color:#EAF2FF!important}
    .good{color:#11835c;font-weight:800}.bad{color:#cf5363;font-weight:800}.empty{color:#a5adb8}
    .dimension-controls{display:flex;align-items:center;gap:8px}
    .dimension-controls label{display:flex;align-items:center;gap:7px;padding:7px 9px;border:2px solid #b9afe0;border-radius:11px;background:#f7f4ff;color:#6554a1;font-size:13px;font-weight:800}
    .dimension-controls select{min-width:165px;border:1px solid #c9c0e8;border-radius:7px;background:#fff;padding:5px 7px;color:#40365f;font-weight:700}
    .dimension-tabs{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:10px}
    .dimension-tabs button{padding:7px 13px;border:1px solid #dfe4eb;border-radius:9px;background:#fff;color:#657286;cursor:pointer}
    .dimension-tabs button.active{border-color:#7865bd;background:#7865bd;color:#fff}
    .no-data{padding:40px;text-align:center;color:#919ba8}
    .footer{padding:18px;text-align:center;color:#929ca9;font-size:12px}
    @media(max-width:1100px){
      .template-guide{grid-template-columns:1fr 1fr}.guide-label{grid-column:1/-1}
      .overview{grid-template-columns:1fr}.summary-metrics{grid-template-columns:repeat(3,1fr)}
      .summary-metric:nth-child(4n){border-right:1px solid #edf0f4}.summary-metric:nth-child(3n){border-right:0}
    }
    @media(max-width:680px){
      .shell{padding:10px}.hero{align-items:flex-start;flex-direction:column;padding:20px}.hero h1{font-size:23px}
      .toolbar .refresh-now{margin-left:0}.last-refresh{width:100%}
      .template-guide{grid-template-columns:1fr}.guide-label{grid-column:auto}
      .summary-metrics{grid-template-columns:repeat(2,1fr)}
      .summary-metric:nth-child(3n){border-right:1px solid #edf0f4}.summary-metric:nth-child(2n){border-right:0}
      .section-heading{align-items:flex-start;flex-direction:column}.dimension-controls{width:100%}.dimension-controls label{width:100%}.dimension-controls select{flex:1;min-width:0}
    }
    @media print{body{background:#fff}.toolbar,.template-guide{display:none}.panel,.status-card,.hero{box-shadow:none}.table-scroll{max-height:none;overflow:visible}th{position:static}}
  </style>
</head>
<body data-template="销转中">
<main class="shell">
  <header class="hero">
    <div>
      <div class="eyebrow">NUTRITION AI · DAILY REPORT</div>
      <h1>营养AI组日报在线表格</h1>
      <p>销转结果、运营行课、进量成本与销售明细</p>
    </div>
    <div class="freshness" id="heroStatus">正在读取最新数据</div>
  </header>

  <nav class="toolbar">
    <a href="#overview">今日概览</a>
    <a href="#team">团队整体</a>
    <a href="#personal">销售个人</a>
    <a href="#dimension">细分维度</a>
    <label>指标期数 <select id="period"></select></label>
    <a class="refresh-now" id="refreshNow" href="http://127.0.0.1:18765/refresh-now" target="_blank" rel="noopener" title="仅管理员本机可触发">立即刷新数据</a>
    <button class="export" id="export">导出 Excel</button>
    <span class="last-refresh" id="lastRefresh">最后刷新：—</span>
  </nav>

  <section class="template-guide" aria-label="看板模板指引">
    <div class="guide-label"><b id="activeTemplateTitle">销转中模板</b><span>点击模板可切换标题与重点色</span></div>
    <button class="template-button active" data-template-button="销转中"><span><b>销转中</b><small>GMV · ROI · 转化结果</small></span><i></i></button>
    <button class="template-button" data-template-button="运营中"><span><b>运营中</b><small>D1–D3 到课与完课</small></span><i></i></button>
    <button class="template-button" data-template-button="进量中"><span><b>进量中</b><small>线索量 · 成本 · 单粉成本</small></span><i></i></button>
  </section>

  <div id="content"><div class="no-data">正在加载看板数据…</div></div>
  <footer class="footer">数据源：查询1 · 页面数据按最新成功刷新结果展示</footer>
</main>

<script>
const AI='AI先锋组',MARKET='大盘组',ALL_PERIODS='__all__';
const STATUS_ORDER=['销转中','运营中','进量中'];
const STATUS_CLASS={'销转中':'conversion','已结营':'conversion','运营中':'operation','进量中':'volume'};
const state={data:null,period:ALL_PERIODS,activeStatus:'销转中',dimension:'age',dimensionPeriod:ALL_PERIODS};
const E=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const isNil=v=>v==null||!Number.isFinite(Number(v));
const sign=v=>Number(v)>0?'+':'';
const money=(v,d=0)=>isNil(v)?'—':'¥'+Number(v).toLocaleString('zh-CN',{minimumFractionDigits:d,maximumFractionDigits:d});
const number=(v,d=0)=>isNil(v)?'—':Number(v).toLocaleString('zh-CN',{minimumFractionDigits:d,maximumFractionDigits:d});
const percent=(v,hideZero=false)=>isNil(v)||(hideZero&&Math.abs(Number(v))<1e-12)?'—':(Number(v)*100).toFixed(1)+'%';
const metricValue=(m,def)=>{
  if(!m)return null;
  if(def.calc==='leadUnitCost')return m.leads?m.cost/m.leads:null;
  if(def.day){const x=(m.attendance||[]).find(a=>a.day===def.day);return x?.[def.field]??null}
  return m[def.key];
};
const conversionDefs=[
  {key:'gmv',label:'GMV',type:'money'},
  {key:'roi',label:'ROI',type:'ratio'},
  {key:'conversionRate',label:'转化率',type:'percent'},
  {key:'conversions',label:'人数',type:'number'},
  {key:'serviceRatio',label:'人服比',type:'number1'},
  {key:'todayConversionRate',label:'今日转化率',type:'percent',today:true},
  {key:'todayRoi',label:'今日ROI',type:'ratio',today:true}
];
const operatingDefs=[
  {key:'leads',label:'线索数',type:'number'},
  {key:'friendRate',label:'好友率',type:'percent'},
  {key:'groupRate',label:'进群率',type:'percent'},
  {key:'openRate',label:'开口率',type:'percent'},
  {key:'validConversationRate',label:'有效会话率',type:'percent'},
  ...['D1','D2','D3'].map(day=>({day,field:'attendanceRate',label:day+'到课率',type:'percent',hideZero:true})),
  ...['D1','D2','D3'].map(day=>({day,field:'completionRate',label:day+'完课率',type:'percent',hideZero:true}))
];
const volumeDefs=[
  {key:'leads',label:'线索数',type:'number'},
  {key:'cost',label:'线索成本',type:'money2'},
  {calc:'leadUnitCost',label:'单粉成本',type:'money2'}
];
const defsFor=status=>STATUS_CLASS[status]==='conversion'?conversionDefs:STATUS_CLASS[status]==='operation'?operatingDefs:volumeDefs;
const formatMetric=(value,def,delta=false)=>{
  if(isNil(value)||(def.hideZero&&Math.abs(Number(value))<1e-12))return '—';
  if(def.type==='percent')return (delta?sign(value):'')+(Number(value)*100).toFixed(1)+'%';
  if(def.type==='money')return (delta&&Number(value)>=0?'+':'')+money(value,0);
  if(def.type==='money2')return (delta&&Number(value)>=0?'+':'')+money(value,2);
  if(def.type==='ratio')return (delta?sign(value):'')+Number(value).toFixed(2);
  if(def.type==='number1')return (delta?sign(value):'')+number(value,1);
  return (delta?sign(value):'')+number(value,0);
};
const toneClass=(a,b)=>isNil(a)||isNil(b)?'':Number(a)>Number(b)?'metric-up':Number(a)<Number(b)?'metric-down':'metric-same';
const deltaClass=v=>isNil(v)||Number(v)===0?'':Number(v)>0?'good':'bad';
const statusClass=p=>STATUS_CLASS[p.status]||'conversion';
const groupTotal=(p,name)=>p.groups?.[name]?.total;
const visiblePeriods=()=>{
  if(state.period!==ALL_PERIODS)return state.data.periods.filter(p=>p.name===state.period);
  return STATUS_ORDER.map(status=>state.data.periods.find(p=>p.status===status)).filter(Boolean);
};
const latestPeriod=status=>state.data.periods.find(p=>p.status===status);

function metricCells(m,market,defs,summary=false){
  return defs.map(def=>{
    const value=metricValue(m,def),base=metricValue(market,def);
    const cls=[summary&&m?'':toneClass(value,base),def.today?'today-cell':''].filter(Boolean).join(' ');
    return `<td class="${cls}">${E(formatMetric(value,def))}</td>`;
  }).join('');
}
function compareCells(a,b,defs){
  return defs.map(def=>{
    const av=metricValue(a,def),bv=metricValue(b,def),delta=isNil(av)||isNil(bv)?null:Number(av)-Number(bv);
    return `<td class="${def.today?'today-cell ':''}${deltaClass(delta)}">${E(formatMetric(delta,def,true))}</td>`;
  }).join('');
}
function statusTable(p,scope){
  const defs=defsFor(p.status),ai=groupTotal(p,AI),market=groupTotal(p,MARKET);
  const rows=[];
  if(scope==='team'){
    if(ai)rows.push(`<tr class="summary-row"><td>${AI}</td>${metricCells(ai,market,defs)}</tr>`);
    if(market)rows.push(`<tr class="summary-row"><td>大盘</td>${metricCells(market,null,defs,true)}</tr>`);
    if(ai&&market)rows.push(`<tr class="compare-row"><td>对比（先锋-大盘）</td>${compareCells(ai,market,defs)}</tr>`);
  }else{
    if(ai){
      rows.push(`<tr class="summary-row"><td>AI先锋组汇总</td>${metricCells(ai,market,defs)}</tr>`);
      for(const sale of p.groups[AI].dimensions.sales||[])rows.push(`<tr><td>↳ ${E(sale.label)}</td>${metricCells(sale,market,defs)}</tr>`);
    }
    if(market)rows.push(`<tr class="summary-row"><td>大盘组汇总</td>${metricCells(market,null,defs,true)}</tr>`);
  }
  if(!rows.length)return '';
  const focused=p.status===state.activeStatus?' focused':'';
  return `<article class="status-card ${statusClass(p)}${focused}" data-status-card="${E(p.status)}">
    <div class="status-card-head"><span class="period-status">${E(p.name)} - ${E(p.status)}</span></div>
    <div class="table-scroll"><table><thead><tr><th>范围</th>${defs.map(d=>`<th class="${d.today?'today-head':''}">${E(d.label)}</th>`).join('')}</tr></thead><tbody>${rows.join('')}</tbody></table></div>
  </article>`;
}
function sectionTables(scope){
  const cards=visiblePeriods().map(p=>statusTable(p,scope)).join('');
  return cards||'<div class="no-data">当前期数暂无可展示数据</div>';
}

function summaryDefs(status){
  if(status==='销转中')return conversionDefs;
  if(status==='运营中')return [
    operatingDefs.find(x=>x.label==='D1到课率'),operatingDefs.find(x=>x.label==='D3到课率'),
    operatingDefs.find(x=>x.label==='D3完课率'),operatingDefs.find(x=>x.label==='好友率'),
    operatingDefs.find(x=>x.label==='进群率'),operatingDefs.find(x=>x.label==='有效会话率')
  ];
  return volumeDefs;
}
function summaryCard(status){
  const p=latestPeriod(status);
  if(!p)return '';
  const ai=groupTotal(p,AI),market=groupTotal(p,MARKET),m=ai||market,source=ai?'AI先锋组':'大盘';
  const defs=summaryDefs(status);
  return `<article class="summary-card ${statusClass(p)}">
    <div class="summary-title">${E(p.name)} - ${E(status)} · ${source}</div>
    <div class="summary-metrics">${defs.map(def=>`<div class="summary-metric ${def.today?'today':''}"><span>${E(def.label)}</span><b>${E(formatMetric(metricValue(m,def),def))}</b></div>`).join('')}</div>
  </article>`;
}
function broadcastBlock(p){
  const ai=groupTotal(p,AI),market=groupTotal(p,MARKET),m=ai||market;
  if(!m)return '';
  const defs=summaryDefs(p.status);
  return `<div class="broadcast-block"><div class="broadcast-title ${statusClass(p)}">${E(p.name)}（${E(p.phase.replace(/\s+/g,''))}）- ${E(p.status)}</div>
    ${defs.map(def=>{
      const value=metricValue(m,def),base=metricValue(market,def),delta=ai&&market&&!isNil(value)&&!isNil(base)?Number(value)-Number(base):null;
      if(def.hideZero&&Math.abs(Number(value||0))<1e-12)return '';
      return `<div class="broadcast-line ${def.today?'today':''}"><span>【${E(def.label)}】</span><span>${E(formatMetric(value,def))}${ai&&market?`（大盘 ${E(formatMetric(base,def))}）`:''}</span><span class="delta ${deltaClass(delta)}">${delta==null?'':E(formatMetric(delta,def,true))}</span></div>`;
    }).join('')}
  </div>`;
}
function overviewHtml(){
  const filtered=state.period===ALL_PERIODS?STATUS_ORDER.map(latestPeriod).filter(Boolean):state.data.periods.filter(p=>p.name===state.period);
  const time=new Date(state.data.generatedAt).toLocaleString('zh-CN',{hour12:false});
  return `<section id="overview" class="overview">
    <article class="panel broadcast"><div class="panel-heading">数据播报简报</div><div class="broadcast-list"><div class="broadcast-block"><b>截止 ${E(time)}</b></div>${filtered.map(broadcastBlock).join('')}</div></article>
    <article class="panel summary-rack"><div class="panel-heading">三种状态核心指标</div>${STATUS_ORDER.map(summaryCard).join('')}</article>
  </section>`;
}

const dimensionLabels={age:'年龄',gender:'性别',leadLevel:'初始线索等级',intakeDay:'进量日',channel:'三级渠道'};
function dimensionRows(p,key){
  const defs=defsFor(p.status),ai=p.groups?.[AI]?.dimensions?.[key]||[],market=p.groups?.[MARKET]?.dimensions?.[key]||[];
  const am=new Map(ai.map(x=>[x.label,x])),bm=new Map(market.map(x=>[x.label,x]));
  const labels=[...new Set([...am.keys(),...bm.keys()])],rows=[];
  for(const label of labels){
    const a=am.get(label),b=bm.get(label);
    if(a)rows.push(`<tr><td>${E(p.name)}</td><td>${E(label)}</td><td>先锋组</td>${metricCells(a,b,defs)}</tr>`);
    if(b)rows.push(`<tr><td>${E(p.name)}</td><td>${E(label)}</td><td>大盘</td>${metricCells(b,null,defs,true)}</tr>`);
    if(a&&b)rows.push(`<tr class="compare-row"><td>${E(p.name)}</td><td>${E(label)}</td><td>对比大盘</td>${compareCells(a,b,defs)}</tr>`);
  }
  return {defs,rows};
}
function dimensionTable(p){
  const {defs,rows}=dimensionRows(p,state.dimension);
  if(!rows.length)return '';
  return `<article class="status-card ${statusClass(p)}">
    <div class="status-card-head"><span class="period-status">${E(p.name)} - ${E(p.status)}</span></div>
    <div class="table-scroll"><table><thead><tr><th>期数</th><th>分类</th><th>范围</th>${defs.map(d=>`<th class="${d.today?'today-head':''}">${E(d.label)}</th>`).join('')}</tr></thead><tbody>${rows.join('')}</tbody></table></div>
  </article>`;
}
function dimensionHtml(){
  const periods=state.dimensionPeriod===ALL_PERIODS?state.data.periods:state.data.periods.filter(p=>p.name===state.dimensionPeriod);
  return periods.map(dimensionTable).join('')||'<div class="no-data">当前筛选条件暂无细分数据</div>';
}
function render(){
  document.body.dataset.template=state.activeStatus;
  document.getElementById('activeTemplateTitle').textContent=state.activeStatus+'模板';
  document.querySelectorAll('[data-template-button]').forEach(b=>b.classList.toggle('active',b.dataset.templateButton===state.activeStatus));
  const dimOptions=`<option value="${ALL_PERIODS}">全部期数</option>`+state.data.periods.map(p=>`<option value="${E(p.name)}">${E(p.name)} - ${E(p.status)}</option>`).join('');
  document.getElementById('content').innerHTML=overviewHtml()+
    `<section id="team" class="section"><div class="section-heading"><h2>团队整体</h2></div><div id="teamTables">${sectionTables('team')}</div></section>`+
    `<section id="personal" class="section"><div class="section-heading"><h2>销售个人</h2></div><div id="personalTables">${sectionTables('personal')}</div></section>`+
    `<section id="dimension" class="section"><div class="section-heading"><h2>细分维度</h2><div class="dimension-controls"><label>维度期数 <select id="dimPeriod">${dimOptions}</select></label></div></div>
      <div class="dimension-tabs">${Object.entries(dimensionLabels).map(([k,v])=>`<button data-dimension="${k}" class="${k===state.dimension?'active':''}">${v}</button>`).join('')}</div><div id="dimensionTables">${dimensionHtml()}</div>
    </section>`;
  const dimPeriod=document.getElementById('dimPeriod');dimPeriod.value=state.dimensionPeriod;
  dimPeriod.onchange=()=>{state.dimensionPeriod=dimPeriod.value;document.getElementById('dimensionTables').innerHTML=dimensionHtml()};
  document.querySelectorAll('[data-dimension]').forEach(b=>b.onclick=()=>{state.dimension=b.dataset.dimension;document.querySelectorAll('[data-dimension]').forEach(x=>x.classList.toggle('active',x===b));document.getElementById('dimensionTables').innerHTML=dimensionHtml()});
}
function exportExcel(){
  const tables=[...document.querySelectorAll('table')];
  const body=tables.map((t,i)=>`<h2>${E(t.closest('.status-card')?.querySelector('.period-status')?.textContent||'数据表'+(i+1))}</h2>${t.outerHTML}<br>`).join('');
  const html=`<html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:x="urn:schemas-microsoft-com:office:excel"><head><meta charset="UTF-8"><style>table{border-collapse:collapse}th,td{border:1px solid #bbb;padding:6px}th{background:#eaf0f7}.metric-up{background:#E8F5E9}.metric-down{background:#FDECEC}.compare-row td{background:#EAF2FF}</style></head><body>${body}</body></html>`;
  const blob=new Blob(['\ufeff',html],{type:'application/vnd.ms-excel;charset=utf-8'}),a=document.createElement('a');
  a.href=URL.createObjectURL(blob);a.download=`营养AI组日报_${new Date().toISOString().slice(0,10)}.xls`;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);
}
async function start(){
  try{
    const stamp=Date.now();
    let r=await fetch('api/dashboard?t='+stamp,{cache:'no-store'});
    if(!r.ok)r=await fetch('data/dashboard.json?t='+stamp,{cache:'no-store'});
    if(!r.ok)r=await fetch('dashboard.json?t='+stamp,{cache:'no-store'});
    if(!r.ok)throw new Error('无法读取最新数据');
    state.data=await r.json();
    const sel=document.getElementById('period');
    sel.innerHTML=`<option value="${ALL_PERIODS}">全部期数</option>`+state.data.periods.map(p=>`<option value="${E(p.name)}">${E(p.name)} - ${E(p.status)}</option>`).join('');
    sel.value=state.period;
    sel.onchange=()=>{state.period=sel.value;render()};
    document.getElementById('export').onclick=exportExcel;
    document.querySelectorAll('[data-template-button]').forEach(b=>b.onclick=()=>{
      state.activeStatus=b.dataset.templateButton;render();
      const card=document.querySelector(`[data-status-card="${state.activeStatus}"]`);if(card)card.scrollIntoView({behavior:'smooth',block:'start'});
    });
    document.getElementById('refreshNow').onclick=()=>{document.getElementById('lastRefresh').textContent='已启动本机刷新，请在新页面查看进度'};
    const time=new Date(state.data.generatedAt).toLocaleString('zh-CN',{hour12:false});
    document.getElementById('heroStatus').textContent=`已更新 ${time} · ${number(state.data.source.rowCount)} 行`;
    document.getElementById('lastRefresh').textContent=`最后刷新：${time}`;
    render();
  }catch(error){
    document.getElementById('content').innerHTML=`<div class="no-data">数据加载失败：${E(error.message)}</div>`;
    document.getElementById('heroStatus').textContent='数据加载失败';
  }
}
start();
</script>
