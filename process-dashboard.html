<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>营养过程数据监控专题</title>
  <style>
    :root{--ink:#223047;--muted:#77859a;--line:#dfe7ee;--blue:#4d83d8;--blue-soft:#eaf5fb;--cyan:#bfe9f8;--green:#55b78a;--green-soft:#eaf8f0;--pink:#f5c3dc;--pink-soft:#fff1f7;--amber:#d99437;--red:#ce5162;--white:#fff;--bg:#f4f7f9;--shadow:0 12px 34px rgba(39,63,78,.08)}
    *{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:linear-gradient(180deg,#f2f7f7,#f6f8fb 420px);color:var(--ink);font:14px/1.6 Inter,"Segoe UI","Microsoft YaHei",sans-serif}.shell{max-width:1640px;margin:auto;padding:22px}.hero{position:relative;overflow:hidden;padding:28px 30px;border:1px solid #dce9e7;border-radius:22px;background:linear-gradient(135deg,#fff,#f2fbf7);box-shadow:var(--shadow)}.hero:before{position:absolute;inset:0 auto 0 0;width:5px;background:linear-gradient(var(--green),var(--blue));content:""}.hero-row,.toolbar,.section-head,.kpi-head{display:flex;align-items:center}.hero-row{justify-content:space-between;gap:20px}.eyebrow{color:#398e70;font-size:11px;font-weight:850;letter-spacing:.17em}.hero h1{margin:5px 0 4px;font-size:29px;line-height:1.25}.hero p{margin:0;color:var(--muted)}.status{padding:9px 13px;border:1px solid #dce7e3;border-radius:12px;background:#ffffffc7;color:#587065;white-space:nowrap}.status:before{display:inline-block;width:8px;height:8px;margin-right:8px;border-radius:50%;background:#31b67c;box-shadow:0 0 0 5px #31b67c18;content:""}.toolbar{position:sticky;top:0;z-index:10;gap:10px;flex-wrap:wrap;margin:14px 0;padding:11px 13px;border:1px solid var(--line);border-radius:15px;background:#ffffffee;box-shadow:0 7px 22px #34435a0c;backdrop-filter:blur(14px)}.toolbar a,.toolbar label{color:#6d7c90;font-size:12px;font-weight:750}.toolbar a{padding:7px 11px;border:1px solid #dfe6ec;border-radius:10px;text-decoration:none}.toolbar select{min-width:126px;margin-left:5px;padding:7px 10px;border:1px solid #dce4ea;border-radius:9px;background:#fff;color:#34465d;font:inherit;font-weight:750}.toolbar .directory{color:#fff;background:var(--green);border-color:var(--green)}.grid{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(480px,.75fr);gap:14px}.panel{padding:19px;border:1px solid var(--line);border-radius:18px;background:#fff;box-shadow:var(--shadow)}.section-head{justify-content:space-between;gap:12px;margin-bottom:14px}.section-title{font-size:17px;font-weight:850}.section-sub{color:var(--muted);font-size:12px}.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}.kpi{min-height:102px;padding:14px;border:1px solid #e4eaef;border-radius:14px;background:linear-gradient(145deg,#fff,#f9fbfc)}.kpi-head{justify-content:space-between;color:#8490a0;font-size:11px}.kpi strong{display:block;margin-top:4px;font-size:24px;line-height:1.3}.delta{display:inline-block;margin-top:6px;font-size:11px;font-weight:800}.good{color:#218365}.bad{color:var(--red)}.neutral{color:#8c97a5}.chart-wrap{height:285px;margin-top:17px;padding:12px;border:1px solid #e4eaef;border-radius:14px;background:#fbfcfd}.chart-wrap svg{display:block;width:100%;height:100%}.legend{display:flex;gap:16px;justify-content:center;margin-top:-4px;color:#718095;font-size:11px}.legend span:before{display:inline-block;width:18px;height:3px;margin:0 6px 3px 0;border-radius:3px;background:var(--green);content:""}.legend span.previous:before{background:#8799bd}.alert-list{display:grid;gap:8px}.alert-item{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;padding:11px 12px;border:1px solid #efe4e6;border-radius:12px;background:#fffafa}.alert-item b{display:block}.alert-item small{color:#8e98a6}.alert-item strong{align-self:center;color:var(--red)}.empty{padding:30px;color:#9aa5b1;text-align:center}.section{margin-top:16px}.section-bar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:11px;padding:12px 17px;border:1px solid var(--line);border-left:5px solid var(--blue);border-radius:14px;background:#fff;box-shadow:0 5px 18px #3a4c6508}.section-bar h2{margin:0;font-size:18px;color:#356eae}.table-card{overflow:hidden;border:1px solid var(--line);border-radius:17px;background:#fff;box-shadow:var(--shadow)}.table-scroll{overflow:auto;max-height:570px}table{width:100%;border-collapse:separate;border-spacing:0;font-size:12px}th,td{min-width:104px;height:42px;padding:9px 11px;border-right:1px solid #e5ebef;border-bottom:1px solid #e5ebef;text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}th{position:sticky;top:0;z-index:3;background:#dff1f8;color:#31586d;font-weight:850}th.delta-head{background:#fdeaf3;color:#9b5875}th:first-child,td:first-child{position:sticky;left:0;z-index:2;min-width:138px;text-align:left;background:inherit}th:first-child{z-index:4;background:#dff1f8}tbody tr{background:#fff}tbody tr:nth-child(even){background:#fafcfd}tbody tr:hover{background:#f4faf7}td.name{font-weight:750;color:#3b5268}td.pending{color:#a5adb6}.tabs{display:flex;gap:7px;flex-wrap:wrap}.tabs button{padding:8px 12px;border:1px solid #dce5e9;border-radius:10px;background:#fff;color:#617287;font:inherit;font-weight:750;cursor:pointer}.tabs button.active{border-color:#83c9ad;background:var(--green-soft);color:#26785b}.detail-head{background:#c7edf8!important}.comparison{background:#fff6fa!important}.note{padding:10px 14px;color:#8c98a6;font-size:11px}.loading,.error{padding:80px;text-align:center}.error{color:var(--red)}
    @media(max-width:1050px){.grid{grid-template-columns:1fr}.kpis{grid-template-columns:repeat(2,1fr)}}
    @media(max-width:680px){.shell{padding:10px}.hero{padding:21px}.hero-row{align-items:flex-start;flex-direction:column}.hero h1{font-size:23px}.kpis{grid-template-columns:1fr 1fr}.toolbar{position:static}.toolbar label{display:grid;grid-template-columns:auto 1fr;align-items:center;flex:1 1 100%}.toolbar select{width:100%}}
  </style>
</head>
<body><main class="shell">
  <header class="hero"><div class="hero-row"><div><div class="eyebrow">NUTRITION AI · PROCESS MONITORING</div><h1>营养过程数据监控专题</h1><p>从先导课到 D4，按期数、渠道、价格、部门与销售监控听课过程表现</p></div><div class="status" id="status">正在读取聚合数据</div></div></header>
  <nav class="toolbar"><a class="directory" href="dashboard.html#process" target="_top">专题目录</a><a href="#overview">过程概览</a><a href="#summary">期数汇总</a><a href="#dimension">分层分析</a><label>分析期数<select id="period"></select></label><label>课程节点<select id="stage"></select></label><label>重点指标<select id="metric"></select></label></nav>
  <div id="content"><div class="loading">正在生成过程监控看板…</div></div>
</main><script>
const E=value=>String(value??'').replace(/[&<>"']/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
const P=value=>value==null?'—':`${(value*100).toFixed(1)}%`,N=value=>value==null?'—':Number(value).toLocaleString('zh-CN',{maximumFractionDigits:0});
const dimensionLabels={secondChannel:'二级渠道',infoThirdChannel:'信息流 · 三级渠道',infoPrice:'信息流 · 三级渠道分价格',infoDepartmentSales:'信息流 · 部门/销售',infoSales:'信息流 · 销售',infoSalesThird:'信息流 · 销售/三级渠道'};
let data,currentDimension='secondChannel';
function delta(value,base){return value==null||base==null?null:value-base}
function deltaHtml(value,base){const d=delta(value,base);return d==null?'<span class="delta neutral">对比暂无</span>':`<span class="delta ${d>0?'good':d<0?'bad':'neutral'}">较上期 ${d>0?'+':''}${(d*100).toFixed(1)}pp</span>`}
function linePath(values,width,height,padding){const valid=values.map((value,index)=>({value,index})).filter(item=>item.value!=null);if(!valid.length)return '';return valid.map((item,position)=>`${position?'L':'M'} ${padding+item.index*(width-padding*2)/(values.length-1)} ${height-padding-item.value*(height-padding*2)}`).join(' ')}
function processChart(period,previous){const width=900,height=250,padding=38,labels=data.stages.map(stage=>stage.label),current=data.stages.map(stage=>period.metrics[stage.key].attendance),prior=data.stages.map(stage=>previous?.metrics[stage.key].attendance??null),grid=[0,.25,.5,.75,1].map(value=>`<line x1="${padding}" y1="${height-padding-value*(height-padding*2)}" x2="${width-padding}" y2="${height-padding-value*(height-padding*2)}" stroke="#e7ecef"/><text x="7" y="${height-padding-value*(height-padding*2)+4}" fill="#8a96a5" font-size="11">${value*100}%</text>`).join(''),x=labels.map((label,index)=>`<text x="${padding+index*(width-padding*2)/(labels.length-1)}" y="${height-10}" text-anchor="middle" fill="#758397" font-size="12">${label}</text>`).join('');return `<div class="chart-wrap"><svg viewBox="0 0 ${width} ${height}" role="img" aria-label="到课率过程趋势">${grid}${x}<path d="${linePath(prior,width,height,padding)}" fill="none" stroke="#8799bd" stroke-width="3" stroke-dasharray="7 5"/><path d="${linePath(current,width,height,padding)}" fill="none" stroke="#55b78a" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>${current.map((value,index)=>value==null?'':`<circle cx="${padding+index*(width-padding*2)/(current.length-1)}" cy="${height-padding-value*(height-padding*2)}" r="5" fill="#fff" stroke="#55b78a" stroke-width="3"/>`).join('')}</svg></div><div class="legend"><span>${E(period.name)}</span><span class="previous">${E(previous?.name||'上期暂无')}</span></div>`}
function dimensionMap(period,key){return new Map((period?.dimensions[key]||[]).map(item=>[item.label,item]))}
function exceptionHtml(period,previous,stageKey,metricKey){const previousMap=dimensionMap(previous,currentDimension),items=(period.dimensions[currentDimension]||[]).map(item=>({item,prior:previousMap.get(item.label),change:delta(item.metrics[stageKey][metricKey],previousMap.get(item.label)?.metrics[stageKey]?.[metricKey])})).filter(item=>item.change!=null&&item.change<0).sort((a,b)=>a.change-b.change).slice(0,8);return items.length?`<div class="alert-list">${items.map(({item,change})=>`<div class="alert-item"><div><b>${E(item.label)}</b><small>${N(item.userCount)} 人 · 当前 ${P(item.metrics[stageKey][metricKey])}</small></div><strong>${(change*100).toFixed(1)}pp</strong></div>`).join('')}</div>`:'<div class="empty">当前维度没有下降项</div>'}
function summaryTable(){const stageHeads=data.stages.map(stage=>`<th colspan="3">${E(stage.label)}</th>`).join(''),metricHeads=data.stages.map(()=>data.metrics.map(metric=>`<th>${E(metric.label)}</th>`).join('')).join(''),rows=data.periods.map(period=>`<tr><td class="name">${E(period.name)} · ${E(period.phase)}</td><td>${N(period.userCount)}</td>${data.stages.map(stage=>data.metrics.map(metric=>`<td class="${period.metrics[stage.key][metric.key]==null?'pending':''}">${P(period.metrics[stage.key][metric.key])}</td>`).join('')).join('')}</tr>`).join('');return `<div class="table-card"><div class="table-scroll"><table><thead><tr><th rowspan="2">期数</th><th rowspan="2">用户数</th>${stageHeads}</tr><tr>${metricHeads}</tr></thead><tbody>${rows}</tbody></table></div><div class="note">所有比例均按各聚合行“用户数”加权；尚未发生的课程节点显示为“—”。</div></div>`}
function detailTable(period,previous,previous2,stageKey){const currentMap=dimensionMap(period,currentDimension),previousMap=dimensionMap(previous,currentDimension),previous2Map=dimensionMap(previous2,currentDimension),labels=[...new Set([...currentMap.keys(),...previousMap.keys(),...previous2Map.keys()])],rows=labels.map(label=>{const current=currentMap.get(label),prior=previousMap.get(label),prior2=previous2Map.get(label);return `<tr><td class="name">${E(label)}</td><td>${N(current?.userCount)}</td>${data.metrics.map(metric=>`<td>${P(current?.metrics[stageKey]?.[metric.key])}</td><td class="comparison ${delta(current?.metrics[stageKey]?.[metric.key],prior?.metrics[stageKey]?.[metric.key])<0?'bad':'good'}">${delta(current?.metrics[stageKey]?.[metric.key],prior?.metrics[stageKey]?.[metric.key])==null?'—':`${delta(current?.metrics[stageKey]?.[metric.key],prior?.metrics[stageKey]?.[metric.key])>0?'+':''}${(delta(current?.metrics[stageKey]?.[metric.key],prior?.metrics[stageKey]?.[metric.key])*100).toFixed(1)}pp`}</td>`).join('')}<td>${N(prior?.userCount)}</td><td>${N(prior2?.userCount)}</td></tr>`}).join('');return `<div class="table-card"><div class="table-scroll"><table><thead><tr><th>${E(dimensionLabels[currentDimension])}</th><th>${E(period.name)}用户数</th>${data.metrics.map(metric=>`<th>${E(metric.label)}</th><th class="delta-head">较${E(previous?.name||'上期')}</th>`).join('')}<th>${E(previous?.name||'上期')}用户数</th><th>${E(previous2?.name||'上上期')}用户数</th></tr></thead><tbody>${rows||'<tr><td colspan="10" class="empty">当前筛选暂无数据</td></tr>'}</tbody></table></div></div>`}
function render(){const periodName=document.getElementById('period').value,stageKey=document.getElementById('stage').value,metricKey=document.getElementById('metric').value,index=data.periods.findIndex(period=>period.name===periodName),period=data.periods[index]||data.periods[0],previous=data.periods[index+1],previous2=data.periods[index+2],stage=period.metrics[stageKey],prior=previous?.metrics[stageKey],metricLabel=data.metrics.find(metric=>metric.key===metricKey)?.label||'';document.getElementById('content').innerHTML=`<section id="overview" class="grid"><article class="panel"><div class="section-head"><div><div class="section-title">${E(period.name)}过程概览</div><div class="section-sub">${E(period.phase)} · 对比 ${E(previous?.name||'暂无上期')}</div></div></div><div class="kpis"><div class="kpi"><div class="kpi-head"><span>用户数</span><span>${E(period.status)}</span></div><strong>${N(period.userCount)}</strong><span class="delta neutral">${N(period.rowCount)} 条聚合记录</span></div><div class="kpi"><div class="kpi-head"><span>${E(data.stages.find(x=>x.key===stageKey)?.label)}到课率</span><span>过程</span></div><strong>${P(stage.attendance)}</strong>${deltaHtml(stage.attendance,prior?.attendance)}</div><div class="kpi"><div class="kpi-head"><span>有效到课率</span><span>质量</span></div><strong>${P(stage.effective)}</strong>${deltaHtml(stage.effective,prior?.effective)}</div><div class="kpi"><div class="kpi-head"><span>完课率</span><span>留存</span></div><strong>${P(stage.completion)}</strong>${deltaHtml(stage.completion,prior?.completion)}</div></div>${processChart(period,previous)}</article><aside class="panel"><div class="section-head"><div><div class="section-title">重点下降监控</div><div class="section-sub">${E(dimensionLabels[currentDimension])} · ${E(metricLabel)}较上期</div></div></div>${exceptionHtml(period,previous,stageKey,metricKey)}</aside></section><section id="summary" class="section"><div class="section-bar"><h2>PART 1 · 听课数据汇总</h2><span class="section-sub">先导课—D4完整过程</span></div>${summaryTable()}</section><section id="dimension" class="section"><div class="section-bar"><h2>PART 2 · 分层过程数据</h2><div class="tabs">${Object.entries(dimensionLabels).map(([key,label])=>`<button data-dimension="${key}" class="${key===currentDimension?'active':''}">${E(label)}</button>`).join('')}</div></div>${detailTable(period,previous,previous2,stageKey)}</section>`;document.querySelectorAll('[data-dimension]').forEach(button=>button.onclick=()=>{currentDimension=button.dataset.dimension;render()})}
async function start(){try{let response=await fetch('data/process-dashboard.json',{cache:'no-store'});if(!response.ok)response=await fetch('process-dashboard.json',{cache:'no-store'});if(!response.ok)throw new Error('过程数据文件不存在');data=await response.json();const period=document.getElementById('period'),stage=document.getElementById('stage'),metric=document.getElementById('metric');period.innerHTML=data.periods.map(item=>`<option value="${E(item.name)}">${E(item.name)} · ${E(item.status)}</option>`).join('');stage.innerHTML=data.stages.map(item=>`<option value="${item.key}">${E(item.label)}</option>`).join('');metric.innerHTML=data.metrics.map(item=>`<option value="${item.key}">${E(item.label)}</option>`).join('');const current=data.periods.find(item=>item.status==='当期')||data.periods[0];period.value=current.name;const available=[...data.stages].reverse().find(item=>current.metrics[item.key].attendance!=null);stage.value=available?.key||data.stages[0].key;metric.value='attendance';[period,stage,metric].forEach(select=>select.onchange=render);document.getElementById('status').textContent=`已读取 ${N(data.source.rowCount)} 行 · ${data.periods.length} 个期数`;render()}catch(error){document.getElementById('content').innerHTML=`<div class="error">数据加载失败：${E(error.message)}</div>`;document.getElementById('status').textContent='数据加载失败'}}start();
</script></body></html>
