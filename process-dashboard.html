l{overflow:auto;max-height:590px}table{width:100%;border-collapse:separate;border-spacing:0;font-size:12.5px}th,td{height:40px;padding:8px 11px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);text-align:center;white-space:nowrap;font-variant-numeric:tabular-nums}th{position:sticky;top:0;z-index:5;background:linear-gradient(#fff,#f3f5f6);font-weight:850}th.metric-head,.metric-head{background:linear-gradient(#d8f1f9,var(--blue))}th.compare-head,.compare-head{background:linear-gradient(#fff1eb,var(--pink))}tbody tr:nth-child(even):not(.delta-row):not(.total-row){background:#fafcfd}tbody tr:hover:not(.total-row){background:#f1f8fb!important}.summary-table td:first-child,.summary-table th:first-child{position:sticky;left:0;z-index:6;background:#fff;font-weight:850}.summary-table .current-row td{font-weight:850;background:#f5fbf8}.summary-table .delta-row td{background:#fffaf1;color:#7c6a4c}.summary-table .delta-row td.positive{color:#16815c!important}.summary-table .delta-row td.negative{color:var(--red)!important}.summary-table .historical-row td:first-child{background:#f2f4f5}.positive{color:#16815c;font-weight:800}.negative{color:var(--red);font-weight:800}.muted{color:#9aa4af}.filter-box{margin:12px 0;border:1px solid #b7c2ca;border-radius:10px;background:#fff;overflow:hidden;box-shadow:var(--shadow)}.filter-row{gap:16px;padding:12px 15px;background:linear-gradient(#e3e6e8,#d8dcdf)}.filter-row strong{min-width:72px}.filter-row label{font-weight:750}.filter-row select{min-width:170px;margin-left:8px;padding:7px 10px;border:1px solid #9faab4;border-radius:7px;background:#fff;font:inherit;font-weight:750}.switch-head{display:grid;grid-template-columns:1fr 1fr;border-top:1px solid #aeb5bc}.switch-head b{padding:8px 12px;text-align:center;background:#f3c4e2}.switch-head b:last-child{background:#f1d4ca}.switch-tabs{display:grid;grid-template-columns:repeat(6,minmax(130px,1fr));border-top:1px solid #aeb5bc;background:var(--green)}.switch-tabs button{min-height:44px;padding:8px 10px;border:0;border-right:1px solid #a9ddb4;background:transparent;color:#345643;font:inherit;font-size:12px;font-weight:800;cursor:pointer}.switch-tabs button:last-child{border-right:0}.switch-tabs button:hover{background:#bce9c6}.switch-tabs button.active{background:#2fa873;color:#fff;box-shadow:inset 0 -3px #19795a}.detail-title{margin:14px 0 8px;padding:9px 14px;border:1px solid #bac3ca;border-radius:7px;background:linear-gradient(#e4e7e9,#d8dcdf);font-size:13px;font-weight:850}.paired{display:grid;grid-template-columns:minmax(470px,.9fr) minmax(760px,1.45fr);gap:12px}.subpanel{min-width:0}.subpanel-label{display:flex;justify-content:space-between;align-items:center;padding:9px 12px;border:1px solid #aeb8c0;border-bottom:0;border-radius:9px 9px 0 0;background:#f5f6f7;font-size:12px;font-weight:850}.current-label{background:#eefaf2}.history-label{background:#fff6f0}.warning-cell{min-width:72px}.warning{display:inline-block;padding:2px 8px;border-radius:11px;background:var(--red-soft);color:var(--red);font-size:10px;font-weight:850}.total-row td{background:var(--blue);font-weight:850}.period-divider td{border-top:3px solid #98a3ad}.rank-table td:first-child,.rank-table th:first-child,.price-table td:first-child,.price-table th:first-child{text-align:left}.risk-row td{color:var(--red);background:var(--red-soft)!important;font-weight:750}.group-row td{background:#eef6f9;font-weight:850;text-align:left}.price-summary td{background:#f1f8fb;font-weight:800}.note{padding:10px 13px;color:#7e8a97;font-size:11px}.loading,.error{padding:80px;text-align:center}.error{color:var(--red)}

.monitor-type{padding:2px 6px;border-radius:9px;background:#eef3f5;color:#61717e;font-size:9px;font-weight:850}.monitor-item b{display:block;font-size:12px}.monitor-item small{display:block;color:#8b96a1}.monitor-deltas{display:grid;gap:2px;text-align:right;font-size:10px}.monitor-empty{padding:30px 10px;color:#96a0aa;text-align:center}

<body><main class="shell">
  <header class="hero"><div class="hero-row"><div><div class="eyebrow">NUTRITION AI · PROCESS MONITORING</div><h1>健康营养听课过程数据</h1><p>严格对应 Excel「看板模板」：听课数据汇总与过程数据明细</p></div><div class="status" id="status">正在读取数据</div></div></header>
  <nav class="toolbar"><a href="dashboard.html#process" target="_top">专题目录</a><a href="#overview">过程概览</a><a href="#summary">PART 1 · 听课数据汇总</a><a href="#detail">PART 2 · 过程数据明细</a></nav>
  <div id="content"><div class="loading">正在生成模板化看板…</div></div>
</main><script>
const E=value=>String(value??'').replace(/[&<>"']/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
const P=value=>value==null?'—':`${(value*100).toFixed(1)}%`,N=value=>value==null?'—':Number(value).toLocaleString('zh-CN',{maximumFractionDigits:0});
const D=(value,base,type='rate')=>value==null||base==null?null:value-base;
const deltaText=(value,base,type='rate')=>{const change=D(value,base,type);if(change==null)return '—';const sign=change>0?'+':'';return type==='count'?`${sign}${N(change)}`:`${sign}${(change*100).toFixed(1)}pp`};
const tone=(value,base)=>{const change=D(value,base);return change==null?'muted':change>0?'positive':change<0?'negative':'muted'};
const dimensionLabels={secondChannel:'part1：二级渠道',infoThirdChannel:'part2：信息流',infoPrice:'part3：信息流分价格',infoDepartmentSales:'part1：信息流-团队-销售',infoSales:'part2：信息流-销售',infoSalesThird:'part3：销售-三级渠道'};
const preferred={secondChannel:['矩阵私域','公号推文','特训营平台','信息流','增长转化中心','横向复购','获客分层','超V团队','裂变流量&转介绍','CPA/CPS','搜索','短视频矩阵'],infoThirdChannel:['百度','抖音','视频号','微信-免费','穿山甲','抖音直播','小红书','百度策略运营组','智能版位','快手','搜索','短视频矩阵']};
let data,currentDimension='secondChannel';
const metricKeys=['attendance','effective','completion'];
function rateCells(metrics,stageKey,head=false){return metricKeys.map(key=>`<${head?'th':'td'} class="${head?'metric-head':''}">${head?E({attendance:'到课率',effective:'有效到课率',completion:'完课率'}[key]):P(metrics?.[stageKey]?.[key])}</${head?'th':'td'}>`).join('')}
function getPeriod(index){return data.periods[index]||null}
function periodMap(period,key){return new Map((period?.dimensions[key]||[]).map(item=>[item.label,item]))}
function sortLabels(labels,key,current,previous,previous2){const maps=[current,previous,previous2].map(period=>periodMap(period,key));return [...labels].sort((a,b)=>(maps[0].get(b)?.userCount??maps[1].get(b)?.userCount??maps[2].get(b)?.userCount??0)-(maps[0].get(a)?.userCount??maps[1].get(a)?.userCount??maps[2].get(a)?.userCount??0)||a.localeCompare(b,'zh-CN'))}
function aggregateItems(items){const result={userCount:items.reduce((sum,item)=>sum+item.userCount,0),metrics:{}};for(const stage of data.stages){result.metrics[stage.key]={};for(const key of metricKeys){let weighted=0,coverage=0;for(const item of items){const value=item.metrics[stage.key]?.[key],users=item.metrics[stage.key]?.[`${key}Coverage`]||0;if(value==null||!users)continue;weighted+=value*users;coverage+=users}result.metrics[stage.key][key]=coverage?weighted/coverage:null;result.metrics[stage.key][`${key}Coverage`]=coverage}}return result}
function compareLines(value,previousValue,previous2Value,type='rate'){
  const line=(label,base)=>`<span><i>${label}</i><b class="${tone(value,base)}">${deltaText(value,base,type)}</b></span>`;
  return `<div class="compare-lines">${line('较上期',previousValue)}${line('较上上期',previous2Value)}</div>`;
}
function chartPath(values,width,height,padding){
  return values.map((value,index)=>value==null?null:[padding+index*(width-padding*2)/(values.length-1),height-padding-value*(height-padding*2)]).filter(Boolean).map((point,index)=>`${index?'L':'M'} ${point[0]} ${point[1]}`).join(' ');
}
function courseChart(period){
  const width=860,height=245,padding=34,series=[['attendance','到课率','#3e83d7',-12],['effective','有效到课率','#31a47a',13],['completion','完课率','#a26bc1',-25]],labels=data.stages.map(stage=>stage.label);
  const grid=[0,.25,.5,.75,1].map(value=>`<line x1="${padding}" y1="${height-padding-value*(height-padding*2)}" x2="${width-padding}" y2="${height-padding-value*(height-padding*2)}" stroke="#e5eaee"/><text x="3" y="${height-padding-value*(height-padding*2)+4}" fill="#8a96a3" font-size="10">${value*100}%</text>`).join('');
  const x=labels.map((label,index)=>`<text x="${padding+index*(width-padding*2)/(labels.length-1)}" y="${height-8}" text-anchor="middle" fill="#667587" font-size="11">${label}</text>`).join('');
  const lines=series.map(([key,,color,offset])=>{const values=data.stages.map(stage=>period.metrics[stage.key]?.[key]);return `<path d="${chartPath(values,width,height,padding)}" fill="none" stroke="${color}" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>${values.map((value,index)=>value==null?'':`<circle cx="${padding+index*(width-padding*2)/(values.length-1)}" cy="${height-padding-value*(height-padding*2)}" r="4" fill="#fff" stroke="${color}" stroke-width="2"/><text x="${padding+index*(width-padding*2)/(values.length-1)}" y="${height-padding-value*(height-padding*2)+offset}" text-anchor="middle" fill="${color}" font-size="9">${P(value)}</text>`).join('')}`}).join('');
  return `<div class="course-chart"><svg viewBox="0 0 ${width} ${height}" role="img" aria-label="每节课到课率、有效到课率和完课率">${grid}${x}${lines}</svg><div class="chart-legend">${series.map(([,label,color])=>`<span style="--series:${color}">${label}</span>`).join('')}</div></div>`;
}
function monitorItems(stageKey){
  const current=getPeriod(0),previous=getPeriod(1),market=current.metrics[stageKey]?.effective,items=[];
  for(const [type,key] of [['销售','infoSales'],['渠道','secondChannel']]){
    const prior=periodMap(previous,key);
    for(const item of current.dimensions[key]||[]){
      const value=item.metrics[stageKey]?.effective,previousValue=prior.get(item.label)?.metrics[stageKey]?.effective,vsPrevious=D(value,previousValue),vsMarket=D(value,market);
      if(value==null||((vsPrevious==null||vsPrevious>=0)&&(vsMarket==null||vsMarket>=0)))continue;
      items.push({type,label:item.label,value,vsPrevious,vsMarket});
    }
  }
  return items.sort((a,b)=>Math.min(a.vsPrevious??0,a.vsMarket??0)-Math.min(b.vsPrevious??0,b.vsMarket??0)).slice(0,12);
}
function changeText(change){return change==null?'—':`${change>0?'+':''}${(change*100).toFixed(1)}pp`}
function overviewHtml(){
  const current=getPeriod(0),previous=getPeriod(1),previous2=getPeriod(2),stage=[...data.stages].reverse().find(item=>current.metrics[item.key].attendance!=null)||data.stages[0],metrics=current.metrics[stage.key],prior=previous?.metrics[stage.key],prior2=previous2?.metrics[stage.key],monitors=monitorItems(stage.key);
  const monitorHtml=monitors.map(item=>`<div class="monitor-item"><span class="monitor-type">${item.type}</span><div><b>${E(item.label)}</b><small>${E(stage.label)}有效到课率 ${P(item.value)}</small></div><div class="monitor-deltas"><span class="${item.vsPrevious<0?'negative':'positive'}">较上期 ${changeText(item.vsPrevious)}</span><span class="${item.vsMarket<0?'negative':'positive'}">较大盘 ${changeText(item.vsMarket)}</span></div></div>`).join('');
  return `<section id="overview" class="section"><div class="section-heading"><h2>过程概览</h2><span>当前期数过程表现与重点下降监控</span></div><div class="overview-layout"><article class="overview-main"><div class="overview-top"><div class="overview-title">${E(current.name)}过程概览</div><span class="overview-phase">${E(current.phase)} · 当前节点 ${E(stage.label)}</span></div><div class="overview-kpis"><div class="overview-kpi"><label>用户数</label><strong>${N(current.userCount)}</strong>${compareLines(current.userCount,previous?.userCount,previous2?.userCount,'count')}</div><div class="overview-kpi"><label>${E(stage.label)}到课率</label><strong>${P(metrics.attendance)}</strong>${compareLines(metrics.attendance,prior?.attendance,prior2?.attendance)}</div><div class="overview-kpi"><label>${E(stage.label)}有效到课率</label><strong>${P(metrics.effective)}</strong>${compareLines(metrics.effective,prior?.effective,prior2?.effective)}</div><div class="overview-kpi"><label>${E(stage.label)}完课率</label><strong>${P(metrics.completion)}</strong>${compareLines(metrics.completion,prior?.completion,prior2?.completion)}</div></div>${courseChart(current)}</article><aside class="monitor-panel"><div class="overview-top"><div class="overview-title">重点下降监控</div><span class="overview-phase">销售 + 渠道</span></div><div class="monitor-note">监控指标：${E(stage.label)}有效到课率；大盘为${E(current.name)}整体加权值 ${P(metrics.effective)}</div><div class="monitor-list">${monitorHtml||'<div class="monitor-empty">当前没有较上期或较大盘下降的项目</div>'}</div></aside></div></section>`;
}
function summaryHtml(){const current=getPeriod(0),previous=getPeriod(1),previous2=getPeriod(2),headers=data.stages.map(stage=>metricKeys.map((key,index)=>`<th class="metric-head">${E(stage.label)}${['到课率','有效到课率','完课率'][index]}</th>`).join('')).join('');const actualRow=(period,klass)=>`<tr class="${klass}"><td>${E(period?.name||'—')}</td><td>${N(period?.userCount)}</td>${data.stages.map(stage=>metricKeys.map(key=>`<td>${P(period?.metrics[stage.key]?.[key])}</td>`).join('')).join('')}</tr>`;const deltaRow=(label,base)=>`<tr class="delta-row"><td>${label}</td><td class="${current&&base?(current.userCount-base.userCount)>0?'positive':(current.userCount-base.userCount)<0?'negative':'muted':'muted'}">${deltaText(current?.userCount,base?.userCount,'count')}</td>${data.stages.map(stage=>metricKeys.map(key=>`<td class="${tone(current?.metrics[stage.key]?.[key],base?.metrics[stage.key]?.[key])}">${deltaText(current?.metrics[stage.key]?.[key],base?.metrics[stage.key]?.[key])}</td>`).join('')).join('')}</tr>`;return `<section id="summary" class="section"><div class="section-heading"><h2>PART 1 · 听课数据汇总</h2><span>当期、环比上期、环比上上期及两期实际值</span></div><div class="sheet-card"><div class="table-scroll"><table class="summary-table"><thead><tr><th>期数</th><th>用户数</th>${headers}</tr></thead><tbody>${actualRow(current,'current-row')}${deltaRow('环比上期',previous)}${deltaRow('环比上上期',previous2)}${actualRow(previous,'historical-row')}${actualRow(previous2,'historical-row')}</tbody></table></div><div class="note">比例按各聚合行用户数加权；未到课程节点显示“—”。</div></div></section>`}
function riskLabels(items,stageKey){const ranked=items.filter(item=>item.userCount>0&&item.metrics[stageKey]?.effective!=null).sort((a,b)=>b.metrics[stageKey].effective-a.metrics[stageKey].effective);if(ranked.length<2||ranked[0].metrics[stageKey].effective===ranked.at(-1).metrics[stageKey].effective)return new Set;const count=Math.max(1,Math.ceil(ranked.length*.1)),cutoff=ranked[ranked.length-count].metrics[stageKey].effective;return new Set(ranked.filter(item=>item.metrics[stageKey].effective<=cutoff).map(item=>item.label))}
function totalFor(period,key){return aggregateItems(period?.dimensions[key]||[])}
function currentTable(period,key,stageKey,labels){const map=periodMap(period,key),items=labels.map(label=>map.get(label)).filter(Boolean),risks=riskLabels(items,stageKey),rows=labels.map(label=>{const item=map.get(label);return `<tr><td>${E(label)}</td><td>${N(item?.userCount)}</td>${rateCells(item?.metrics,stageKey)}<td class="warning-cell">${risks.has(label)?'<span class="warning">关注</span>':'—'}</td></tr>`}).join(''),total=totalFor(period,key);return `<div class="subpanel"><div class="subpanel-label current-label"><span>当期 · ${E(period?.name||'—')}</span><span>${E(data.stages.find(stage=>stage.key===stageKey)?.label||'')}</span></div><div class="sheet-card"><div class="table-scroll"><table><thead><tr><th>${key==='secondChannel'?'二级渠道':'三级渠道'}</th><th class="metric-head">用户数</th>${rateCells(null,stageKey,true)}<th>警戒列</th></tr></thead><tbody>${rows}<tr class="total-row"><td>总计</td><td>${N(total.userCount)}</td>${rateCells(total.metrics,stageKey)}<td>—</td></tr></tbody></table></div></div></div>`}
function historyTable(periods,current,key,stageKey,labels){const currentMap=periodMap(current,key),blocks=periods.map((period,index)=>{const map=periodMap(period,key),rows=labels.map((label,rowIndex)=>{const item=map.get(label),base=currentMap.get(label);return `<tr class="${index&&rowIndex===0?'period-divider':''}"><td>${rowIndex===0?E(period?.name||'—'):''}</td><td>${E(label)}</td><td>${N(item?.userCount)}</td>${rateCells(item?.metrics,stageKey)}${metricKeys.map(metric=>`<td class="compare-head ${tone(item?.metrics[stageKey]?.[metric],base?.metrics[stageKey]?.[metric])}">${deltaText(item?.metrics[stageKey]?.[metric],base?.metrics[stageKey]?.[metric])}</td>`).join('')}</tr>`}).join(''),total=totalFor(period,key),baseTotal=totalFor(current,key);return `${rows}<tr class="total-row"><td></td><td>总计</td><td>${N(total.userCount)}</td>${rateCells(total.metrics,stageKey)}${metricKeys.map(metric=>`<td class="compare-head ${tone(total.metrics[stageKey]?.[metric],baseTotal.metrics[stageKey]?.[metric])}">${deltaText(total.metrics[stageKey]?.[metric],baseTotal.metrics[stageKey]?.[metric])}</td>`).join('')}</tr>`}).join('');return `<div class="subpanel"><div class="subpanel-label history-label"><span>往期 · 对比当期</span><span>${periods.map(period=>E(period?.name||'—')).join(' / ')}</span></div><div class="sheet-card"><div class="table-scroll"><table><thead><tr><th>期数</th><th>${key==='secondChannel'?'二级渠道':'三级渠道'}</th><th class="metric-head">用户数</th>${rateCells(null,stageKey,true)}<th class="compare-head">到课率对比当期</th><th class="compare-head">有效到课率对比当期</th><th class="compare-head">完课率对比当期</th></tr></thead><tbody>${blocks}</tbody></table></div></div></div>`}
function pairedDimension(key,stageKey){const current=getPeriod(0),previous=getPeriod(1),previous2=getPeriod(2),labels=sortLabels(new Set([...(current?.dimensions[key]||[]).map(item=>item.label),...(previous?.dimensions[key]||[]).map(item=>item.label),...(previous2?.dimensions[key]||[]).map(item=>item.label)]),key,current,previous,previous2);return `<div class="detail-title">${key==='secondChannel'?'PART1：二级渠道 听课过程数据':'PART2：三级渠道（信息流）听课过程数据'} · 按当期用户数降序</div><div class="paired">${currentTable(current,key,stageKey,labels)}${historyTable([previous,previous2],current,key,stageKey,labels)}</div>`}
function priceDimension(stageKey){const periods=data.periods.slice(0,3),current=periods[0],parse=item=>{const split=item.label.lastIndexOf(' / ¥');return {channel:item.label.slice(0,split),price:item.label.slice(split+4)}};const byPeriod=periods.map(period=>{const map=new Map;for(const item of period?.dimensions.infoPrice||[]){const {channel,price}=parse(item);if(!map.has(channel))map.set(channel,new Map);map.get(channel).set(price,item)}return map}),channels=[...byPeriod[0].entries()].filter(([,prices])=>[...prices.values()].reduce((sum,item)=>sum+item.userCount,0)>100).map(([channel])=>channel).sort((a,b)=>a.localeCompare(b,'zh-CN')),rows=[];for(const channel of channels){const currentPrices=byPeriod[0].get(channel)||new Map;periods.forEach((period,periodIndex)=>{const prices=byPeriod[periodIndex].get(channel)||new Map,priceLabels=[...new Set(['汇总',...currentPrices.keys(),...prices.keys()])],currentTotal=aggregateItems([...currentPrices.values()]),periodTotal=aggregateItems([...prices.values()]);priceLabels.forEach((price,priceIndex)=>{const item=price==='汇总'?periodTotal:prices.get(price),base=price==='汇总'?currentTotal:currentPrices.get(price);rows.push(`<tr class="${price==='汇总'?'price-summary':''}"><td>${periodIndex===0&&priceIndex===0?E(channel):''}</td><td>${priceIndex===0?E(period.name):''}</td><td>${E(price)}</td><td>${N(item?.userCount)}</td>${rateCells(item?.metrics,stageKey)}${metricKeys.map(metric=>`<td class="compare-head ${periodIndex?tone(item?.metrics[stageKey]?.[metric],base?.metrics[stageKey]?.[metric]):'muted'}">${periodIndex?deltaText(item?.metrics[stageKey]?.[metric],base?.metrics[stageKey]?.[metric]):'—'}</td>`).join('')}</tr>`)})})}return `<div class="detail-title">PART3：三级渠道（信息流）分价格 · 展示当期用户数 &gt; 100 的渠道</div><div class="sheet-card"><div class="table-scroll"><table class="price-table"><thead><tr><th>三级渠道</th><th>期数</th><th>体验营价格</th><th class="metric-head">用户数</th>${rateCells(null,stageKey,true)}<th class="compare-head">到课率差值</th><th class="compare-head">有效到课率差值</th><th class="compare-head">完课率差值</th></tr></thead><tbody>${rows.join('')||'<tr><td colspan="10" class="muted">暂无用户数大于 100 的信息流三级渠道</td></tr>'}</tbody></table></div></div>`}
function rankedRows(items,stageKey,labelBuilder,groupBuilder){const sorted=[...items].filter(item=>item.userCount>0).sort((a,b)=>(b.metrics[stageKey]?.effective??-1)-(a.metrics[stageKey]?.effective??-1)),risks=riskLabels(sorted,stageKey);if(!groupBuilder)return sorted.map(item=>`<tr class="${risks.has(item.label)?'risk-row':''}">${labelBuilder(item)}<td>${N(item.userCount)}</td>${rateCells(item.metrics,stageKey)}</tr>`).join('');const groups=new Map;for(const item of sorted){const group=groupBuilder(item);if(!groups.has(group))groups.set(group,[]);groups.get(group).push(item)}let html='';for(const [group,groupItems] of groups){const total=aggregateItems(groupItems);html+=`<tr class="group-row"><td>${E(group)}</td><td>汇总</td><td>${N(total.userCount)}</td>${rateCells(total.metrics,stageKey)}</tr>`+groupItems.map(item=>`<tr class="${risks.has(item.label)?'risk-row':''}"><td></td>${labelBuilder(item)}<td>${N(item.userCount)}</td>${rateCells(item.metrics,stageKey)}</tr>`).join('')}return html}
function salesDimension(key,stageKey){const period=getPeriod(0),items=period?.dimensions[key]||[];if(key==='infoDepartmentSales'){const rows=rankedRows(items,stageKey,item=>`<td>${E(item.label.split(' / ')[1]||'未分类')}</td>`,item=>item.label.split(' / ')[0]||'未分类');return rankedTable('part1：信息流-团队-销售过程数据',rows,['部门','销售'])}if(key==='infoSales'){const rows=rankedRows(items,stageKey,item=>`<td>${E(item.label)}</td>`);return rankedTable('part2：信息流-销售过程数据',rows,['销售'])}const rows=rankedRows(items,stageKey,item=>`<td>${E(item.label.split(' / ')[0]||'未分类')}</td>`,item=>item.label.split(' / ')[1]||'未分类');return rankedTable('part3：销售-三级渠道过程数据',rows,['三级渠道','销售'])}
function rankedTable(title,rows,labelHeads){return `<div class="detail-title">${title} · 按有效到课率排序，尾部 10% 标红</div><div class="sheet-card"><div class="table-scroll"><table class="rank-table"><thead><tr>${labelHeads.map(label=>`<th>${label}</th>`).join('')}<th class="metric-head">用户数</th>${rateCells(null,'',true)}</tr></thead><tbody>${rows||'<tr><td colspan="7" class="muted">当前暂无数据</td></tr>'}</tbody></table></div></div>`}
function detailContent(stageKey){if(['secondChannel','infoThirdChannel'].includes(currentDimension))return pairedDimension(currentDimension,stageKey);if(currentDimension==='infoPrice')return priceDimension(stageKey);return salesDimension(currentDimension,stageKey)}
function detailHtml(){return `<section id="detail" class="section"><div class="section-heading"><h2>PART 2 · 过程数据明细</h2><span>课程节点筛选、渠道过程数据、信息流与销售过程数据</span></div><div class="filter-box"><div class="filter-row"><strong>筛选区</strong><label>课程节点<select id="stage"></select></label></div><div class="switch-head"><b>渠道过程数据</b><b>信息流 &amp; 销售过程数据</b></div><div class="switch-tabs">${Object.entries(dimensionLabels).map(([key,label])=>`<button data-dimension="${key}" class="${key===currentDimension?'active':''}">${E(label)}</button>`).join('')}</div></div><div id="detailContent"></div></section>`}
function renderDetail(){const stageKey=document.getElementById('stage').value;document.getElementById('detailContent').innerHTML=detailContent(stageKey);document.querySelectorAll('[data-dimension]').forEach(button=>button.classList.toggle('active',button.dataset.dimension===currentDimension))}
async function start(){try{let response=await fetch('data/process-dashboard.json',{cache:'no-store'});if(!response.ok)response=await fetch('process-dashboard.json',{cache:'no-store'});if(!response.ok)throw new Error('过程数据文件不存在');data=await response.json();document.getElementById('content').innerHTML=overviewHtml()+summaryHtml()+detailHtml();const stage=document.getElementById('stage'),current=getPeriod(0);stage.innerHTML=data.stages.map(item=>`<option value="${item.key}">${E(item.label)}</option>`).join('');const available=[...data.stages].reverse().find(item=>current.metrics[item.key].attendance!=null);stage.value=available?.key||data.stages[0].key;stage.onchange=renderDetail;document.querySelectorAll('[data-dimension]').forEach(button=>button.onclick=()=>{currentDimension=button.dataset.dimension;renderDetail()});document.getElementById('status').textContent=`已读取 ${N(data.source.rowCount)} 行 · ${data.periods.length} 个期数`;renderDetail()}catch(error){document.getElementById('content').innerHTML=`<div class="error">数据加载失败：${E(error.message)}</div>`;document.getElementById('status').textContent='数据加载失败'}}start();
</script></body></html>
