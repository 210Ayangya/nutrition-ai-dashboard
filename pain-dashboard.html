<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>病症痛点专题｜营养数据分析中心</title>
  <style>
    :root{--ink:#24223a;--muted:#77758a;--line:#e6e3ef;--violet:#6f5db7;--violet-2:#9d8de0;--soft:#f4f1fb;--mint:#4a9b84;--amber:#c78a32;--rose:#b55d7c;--bg:#f7f6fa;--card:#fff;--shadow:0 16px 42px rgba(55,45,91,.09)}
    *{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font:14px/1.55 Inter,"Segoe UI","Microsoft YaHei",sans-serif}button,select{font:inherit}.page{width:min(1440px,100%);margin:auto;padding:22px}.topbar{display:flex;justify-content:space-between;gap:20px;align-items:flex-start;margin-bottom:18px}.eyebrow{color:var(--violet);font-size:11px;font-weight:900;letter-spacing:.16em}.topbar h1{margin:5px 0 4px;font-size:30px;line-height:1.25}.topbar p{margin:0;color:var(--muted)}.back{color:var(--violet);font-weight:800;text-decoration:none}.filters{display:grid;grid-template-columns:repeat(3,minmax(160px,220px)) auto;gap:10px;align-items:end;padding:15px;border:1px solid var(--line);border-radius:18px;background:#fff;box-shadow:var(--shadow)}label{display:grid;gap:5px;color:var(--muted);font-size:12px;font-weight:700}select{width:100%;min-height:40px;padding:0 34px 0 12px;border:1px solid #dcd8e9;border-radius:11px;background:#fff;color:var(--ink)}.stamp{align-self:center;color:#9894aa;font-size:12px}.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin:14px 0}.kpi{padding:17px 18px;border:1px solid var(--line);border-radius:16px;background:#fff}.kpi span{color:var(--muted);font-size:12px}.kpi strong{display:block;margin:5px 0 2px;font-size:27px;line-height:1}.kpi small{color:#918da0}.grid{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(280px,.75fr);gap:14px}.grid.equal{grid-template-columns:1fr 1fr;margin-top:14px}.card{padding:20px;border:1px solid var(--line);border-radius:18px;background:#fff;box-shadow:var(--shadow)}.card h2{margin:0;font-size:18px}.card-head{display:flex;justify-content:space-between;gap:12px;align-items:end;margin-bottom:16px}.card-head p{margin:3px 0 0;color:var(--muted);font-size:12px}.ranking{display:grid;gap:7px}.rank{display:grid;width:100%;grid-template-columns:118px minmax(120px,1fr) 64px 58px;gap:10px;align-items:center;padding:5px 6px;border:0;border-radius:9px;background:transparent;color:inherit;text-align:left;cursor:pointer}.rank:hover,.rank.active{background:var(--soft)}.rank-name{overflow:hidden;text-overflow:ellipsis;font-weight:750;white-space:nowrap}.track{height:10px;overflow:hidden;border-radius:99px;background:#eeecf3}.fill{height:100%;border-radius:inherit;background:linear-gradient(90deg,var(--violet),var(--violet-2))}.rank-value{text-align:right;font-variant-numeric:tabular-nums;font-weight:800}.rank-rate{text-align:right;color:var(--muted);font-size:12px}.note{margin:15px 0 0;padding-top:13px;border-top:1px solid #efedf4;color:var(--muted);font-size:12px}.empty{padding:50px 12px;text-align:center;color:var(--muted)}.quality-stack{display:grid;gap:11px}.meter{padding:14px;border:1px solid #ece9f2;border-radius:14px}.meter-head{display:flex;justify-content:space-between;gap:12px;margin-bottom:8px}.meter-head b{font-size:15px}.meter-head span{color:var(--muted)}.meter .track{height:8px}.meter.mint .fill{background:var(--mint)}.meter.amber .fill{background:var(--amber)}.insight{margin-top:12px;padding:14px;border-radius:14px;background:linear-gradient(135deg,#f2effb,#faf9fd);color:#5d5676}.trend{display:grid;grid-template-columns:repeat(var(--count),minmax(66px,1fr));gap:8px;align-items:end;min-height:188px;padding-top:12px;border-bottom:1px solid #e9e6ef}.trend-col{display:grid;grid-template-rows:1fr auto;gap:7px;height:168px;text-align:center}.trend-bars{display:flex;align-items:end;justify-content:center;height:138px}.trend-bar{display:grid;align-items:start;width:min(48px,75%);min-height:4px;border-radius:9px 9px 2px 2px;background:linear-gradient(180deg,var(--violet-2),var(--violet));color:#fff;font-size:11px;font-weight:800;padding-top:5px}.trend-col.active .trend-bar{background:linear-gradient(180deg,#63b29a,#35826c)}.trend-label{color:var(--muted);font-size:12px}.distribution{display:grid;gap:10px}.dist-row{display:grid;grid-template-columns:120px 1fr 78px;gap:10px;align-items:center}.dist-label{font-weight:700}.dist-value{text-align:right;font-variant-numeric:tabular-nums}.dist-row .fill{background:var(--mint)}.pairs{display:grid;grid-template-columns:1fr 1fr;gap:9px}.pair{display:flex;justify-content:space-between;gap:12px;padding:11px 12px;border:1px solid #ece9f2;border-radius:12px}.pair b{color:#534a79}.pair span{white-space:nowrap;font-variant-numeric:tabular-nums}.legend{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}.pill{padding:4px 9px;border-radius:99px;background:var(--soft);color:#65588f;font-size:12px}.method{margin-top:14px;padding:15px 18px;border-left:4px solid var(--violet-2);border-radius:4px 14px 14px 4px;background:#f0edf8;color:#625c75}.method b{display:block;margin-bottom:3px;color:#433b62}
    @media(max-width:900px){.page{padding:14px}.topbar{display:block}.back{display:inline-block;margin-top:10px}.filters{grid-template-columns:1fr 1fr}.stamp{grid-column:1/-1}.kpis{grid-template-columns:1fr 1fr}.grid,.grid.equal{grid-template-columns:1fr}}
    @media(max-width:560px){.filters{grid-template-columns:1fr}.kpis{grid-template-columns:1fr 1fr}.rank{grid-template-columns:88px minmax(80px,1fr) 52px}.rank-rate{display:none}.topbar h1{font-size:25px}}
  </style>
</head>
<body>
  <main class="page">
    <header class="topbar"><div><div class="eyebrow">TOPIC 03 · PAIN POINTS</div><h1>病症痛点专题</h1><p>按唯一用户、多标签口径查看痛点结构与记录完整度。</p></div><a class="back" href="dashboard.html#pain" target="_top">返回分析中心</a></header>
    <section class="filters" aria-label="筛选条件">
      <label>期数<select id="period"></select></label>
      <label>阶段<select id="day"></select></label>
      <label>初始会员等级<select id="member"></select></label>
      <div class="stamp" id="stamp">正在读取数据…</div>
    </section>
    <section class="kpis" id="kpis"></section>
    <section class="grid">
      <article class="card"><div class="card-head"><div><h2>痛点标签排行</h2><p>点击标签查看该类用户的时长分布</p></div></div><div class="ranking" id="ranking"></div><p class="note">一个用户可命中多个标签，占比之和可能超过 100%。“其他”包含原始标记为其他及无法匹配指定标签的文本。</p></article>
      <article class="card"><div class="card-head"><div><h2>记录质量</h2><p>分类覆盖与时长填写情况</p></div></div><div id="quality"></div></article>
    </section>
    <section class="grid equal">
      <article class="card"><div class="card-head"><div><h2>期次趋势</h2><p id="trendNote">指定标签在各期唯一用户中的占比</p></div></div><div class="trend" id="trend"></div></article>
      <article class="card"><div class="card-head"><div><h2 id="durationTitle">痛点时长</h2><p>同一用户有多条时长记录时取最长可识别分组</p></div></div><div class="distribution" id="duration"></div></article>
    </section>
    <section class="grid equal">
      <article class="card"><div class="card-head"><div><h2>单痛点与多痛点</h2><p>仅统计命中的非“其他”标签数</p></div></div><div class="distribution" id="labelCounts"></div></article>
      <article class="card"><div class="card-head"><div><h2>高频痛点组合</h2><p>同一用户同时命中的两类痛点</p></div></div><div class="pairs" id="pairs"></div></article>
    </section>
    <aside class="method"><b>统计口径</b><span id="methodText"></span></aside>
  </main>
  <script>
    const $=id=>document.getElementById(id),fmt=new Intl.NumberFormat('zh-CN'),pct=v=>v==null?'—':`${(v*100).toFixed(1)}%`,ALL={period:'全部期数',day:'全部阶段',member:'全部会员等级'};let data,activeLabel='高血压';
    function options(el,all,items){el.innerHTML=[all,...items].map(v=>`<option>${v}</option>`).join('')}
    function chosen(){return data.selections.find(s=>s.period===$('period').value&&s.day===$('day').value&&s.memberLevel===$('member').value)}
    function distributionHtml(entries,total,color=''){const max=Math.max(1,...entries.map(([,value])=>value));return entries.map(([label,value])=>`<div class="dist-row"><div class="dist-label">${label}</div><div class="track"><div class="fill" style="width:${value/max*100}%;${color?`background:${color}`:''}"></div></div><div class="dist-value">${fmt.format(value)} · ${pct(total?value/total:null)}</div></div>`).join('')}
    function render(){const s=chosen();if(!s){$('kpis').innerHTML='<div class="empty">当前组合暂无数据</div>';return}const meaningful=s.categories.filter(x=>x.label!=='其他').sort((a,b)=>b.users-a.users);if(!meaningful.some(x=>x.label===activeLabel))activeLabel=meaningful[0]?.label||'高血压';const multiRate=s.categorizedUsers?s.multiPainUsers/s.categorizedUsers:null;
      $('kpis').innerHTML=[['筛选用户数',fmt.format(s.totalUsers),'唯一用户'],['明确痛点覆盖率',pct(s.painCoverage),`${fmt.format(s.categorizedUsers)} 人`],['多痛点用户占比',pct(multiRate),`${fmt.format(s.multiPainUsers)} 人`],['时长填写率',pct(s.durationCompletionRate),`${fmt.format(s.durationFilledUsers)} 人`]].map(([a,b,c])=>`<article class="kpi"><span>${a}</span><strong>${b}</strong><small>${c}</small></article>`).join('');
      const max=Math.max(1,...meaningful.map(x=>x.users));$('ranking').innerHTML=meaningful.map((x,i)=>`<button class="rank ${x.label===activeLabel?'active':''}" data-label="${x.label}"><div class="rank-name">${i+1}. ${x.label}</div><div class="track"><div class="fill" style="width:${x.users/max*100}%"></div></div><div class="rank-value">${fmt.format(x.users)}</div><div class="rank-rate">${pct(s.totalUsers?x.users/s.totalUsers:null)}</div></button>`).join('')||'<div class="empty">暂无已分类痛点</div>';$('ranking').querySelectorAll('[data-label]').forEach(button=>button.addEventListener('click',()=>{activeLabel=button.dataset.label;render()}));
      const other=s.categories.find(x=>x.label==='其他')?.users||0,coverage=s.painCoverage||0,durationRate=s.durationCompletionRate||0;$('quality').innerHTML=`<div class="quality-stack"><div class="meter mint"><div class="meter-head"><b>指定标签覆盖</b><span>${pct(coverage)}</span></div><div class="track"><div class="fill" style="width:${coverage*100}%"></div></div></div><div class="meter amber"><div class="meter-head"><b>时长填写</b><span>${pct(durationRate)}</span></div><div class="track"><div class="fill" style="width:${durationRate*100}%"></div></div></div><div class="meter"><div class="meter-head"><b>其他 / 未匹配</b><span>${fmt.format(other)} 人</span></div><div class="track"><div class="fill" style="width:${s.totalUsers?other/s.totalUsers*100:0}%;background:var(--rose)"></div></div></div></div><div class="insight">${meaningful[0]?`当前最常见痛点为“${meaningful[0].label}”，覆盖 ${fmt.format(meaningful[0].users)} 人。`: '当前筛选范围暂无明确痛点。'}${durationRate<.2?' 时长记录仍明显不足，相关分布仅作记录质量与方向观察。':''}</div>`;
      const trendRows=data.filters.periods.map(period=>data.selections.find(x=>x.period===period&&x.day===$('day').value&&x.memberLevel===$('member').value)).filter(Boolean),trendValues=trendRows.map(row=>{const item=row.categories.find(x=>x.label===activeLabel);return row.totalUsers?item.users/row.totalUsers:0}),trendMax=Math.max(.01,...trendValues);$('trend').style.setProperty('--count',trendRows.length);$('trend').innerHTML=trendRows.map((row,index)=>`<div class="trend-col ${row.period===$('period').value?'active':''}"><div class="trend-bars"><div class="trend-bar" style="height:${Math.max(4,trendValues[index]/trendMax*100)}%">${pct(trendValues[index])}</div></div><div class="trend-label">${row.period}</div></div>`).join('');$('trendNote').textContent=`“${activeLabel}”在各期唯一用户中的占比`;
      const active=s.categories.find(x=>x.label===activeLabel);$('durationTitle').textContent=`痛点时长 · ${activeLabel}`;$('duration').innerHTML=active?distributionHtml(Object.entries(active.durations),active.users):'<div class="empty">暂无时长数据</div>';
      const countEntries=Object.entries(s.labelCounts).filter(([key])=>key!=='0类');$('labelCounts').innerHTML=distributionHtml(countEntries,s.categorizedUsers,'linear-gradient(90deg,#4a9b84,#79bea9)');$('pairs').innerHTML=s.combinations.slice(0,10).map((item,index)=>`<div class="pair"><b>${index+1}. ${item.label}</b><span>${fmt.format(item.users)} 人</span></div>`).join('')||'<div class="empty">暂无组合数据</div>';
    }
    async function loadPainData(){for(const url of ['pain-dashboard.json','data/pain-dashboard.json']){const response=await fetch(url);if(response.ok)return response.json()}throw Error('数据读取失败')}
    loadPainData().then(value=>{data=value;options($('period'),ALL.period,data.filters.periods);options($('day'),ALL.day,data.filters.days);options($('member'),ALL.member,data.filters.memberLevels);$('stamp').textContent=`更新于 ${new Date(data.generatedAt).toLocaleString('zh-CN',{hour12:false})}`;$('methodText').textContent=`${data.definitions.counting} ${data.definitions.coverage} ${data.source.privacy}。`;['period','day','member'].forEach(id=>$(id).addEventListener('change',render));render()}).catch(error=>{$('stamp').textContent=error.message;$('ranking').innerHTML='<div class="empty">暂时无法读取痛点数据</div>'});
  </script>
</body>
</html>
